{{- $name := .Values.litellm.litemaasSecret.name | default "litemaas-credentials" }}
{{- $keyName := .Values.litellm.litemaasSecret.key | default "api-key" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $helmOwned := and $existing $existing.metadata $existing.metadata.labels (eq (index $existing.metadata.labels "app.kubernetes.io/managed-by") "Helm") }}
{{- $apiKey := .Values.secrets.litemaasApiKey | default "" }}
{{- if and (not $apiKey) $existing $existing.data (index $existing.data $keyName) }}
{{- $apiKey = index $existing.data $keyName | b64dec }}
{{- end }}
{{/*
  Create the LiteMaaS Secret when missing, or update it when Helm already owns it.
  If a user-created Secret already exists (typical Sandbox), leave it in place so
  LiteLLM keeps using litellm.litemaasSecret.name without a 3-way-merge fight.
*/}}
{{- if or (not $existing) $helmOwned }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: litemaas
  annotations:
    rhdh-agent-sandbox/purpose: "LiteMaaS Qwen (litemaas-qwen) tool-calling API key"
type: Opaque
data:
  {{ $keyName }}: {{ $apiKey | b64enc | quote }}
{{- end }}
