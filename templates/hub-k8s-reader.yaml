{{- if and .Values.rhdh.enabled .Values.agents.hubRbac.enabled }}
{{/*
  Hub Kubernetes / Tekton reader — same pattern as
  https://github.com/maximilianoPizarro/developer-hub-on-developer-sandbox
  External API URL + dedicated SA token avoids in-cluster TLS failures.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-hub-k8s-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-k8s-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-hub-k8s-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-k8s-reader
  annotations:
    kubernetes.io/service-account.name: {{ include "rhdh-agent-sandbox.fullname" . }}-hub-k8s-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-hub-k8s-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-k8s-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "services", "services/status", "configmaps", "endpoints", "events", "limitranges", "resourcequotas", "replicationcontrollers", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "replicasets", "replicasets/status", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes", "routes/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs", "builds", "builds/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags", "imagestreamimages"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "pipelineruns", "tasks", "taskruns", "customruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["workspace.devfile.io"]
    resources: ["devworkspaces", "devworkspacetemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-hub-k8s-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-hub-k8s-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "rhdh-agent-sandbox.fullname" . }}-hub-k8s-reader
    namespace: {{ .Release.Namespace }}
{{- end }}
