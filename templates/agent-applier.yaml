                            "env": [
                                {"name": "AGENT_NAME", "value": name},
                                {"name": "MODEL", "value": model},
                                {"name": "FRAMEWORK", "value": framework},
                                {"name": "LANGUAGE", "value": language},
                                {"name": "AGENT_TYPE", "value": agent_type},
                                {"name": "AGENT_SPEC", "value": spec},
                                {"name": "LOG_LEVEL", "value": agent_log_level},
                                {"name": "NAMESPACE", "value": NS},
                                {"name": "LITELLM_API_BASE", "value": f"http://{FULLNAME}-litellm:{LITELLM_PORT}/v1"},
                                {"name": "LITELLM_API_KEY", "valueFrom": {"secretKeyRef": {"name": SECRETS, "key": "litellm-master-key"}}},
                                {"name": "QUARKUS_HTTP_CORS_ENABLED", "value": "true"},
