                    "rhdh-agent-sandbox.io/build": "true",
                },
                "annotations": {
                    "app.openshift.io/connects-to": json.dumps(
                        [{"apiVersion": "apps/v1", "kind": "Deployment", "name": f"{FULLNAME}-litellm"}]
