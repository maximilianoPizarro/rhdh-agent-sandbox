{{- if and .Values.agents.enabled .Values.agents.applier.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-applier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs", "builds"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs/instantiate", "buildconfigs/instantiatebinary"]
    verbs: ["create"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["workspace.devfile.io"]
    resources: ["devworkspaces", "devworkspacetemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
subjects:
  - kind: ServiceAccount
    name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
data:
  applier.py: |
    import hashlib, io, json, os, re, tarfile, time, threading, urllib.error, urllib.parse, urllib.request, ssl
    from http.server import BaseHTTPRequestHandler, HTTPServer

    NS = os.environ["NAMESPACE"]
    FULLNAME = os.environ["FULLNAME"]
    SECRETS = os.environ["SECRETS_NAME"]
    LITELLM_PORT = os.environ.get("LITELLM_PORT", "4000")
    CATALOG = os.environ.get("CATALOG_URL", "http://localhost:7007").rstrip("/")
    TOKEN = os.environ.get("MCP_TOKEN", "")
    POLL_SECONDS = int(os.environ.get("POLL_SECONDS", "45"))
    HEALTH_PORT = int(os.environ.get("HEALTH_PORT", "8080"))
    LOG_LEVEL = os.environ.get("LOG_LEVEL", "INFO").upper()
    SOURCES_CM = os.environ.get("SOURCES_CM", f"{FULLNAME}-agent-build-sources")
    USE_TEKTON = os.environ.get("AGENT_USE_TEKTON", "true").lower() in ("true", "1", "yes")
    DEPLOY_PIPELINE = os.environ.get("DEPLOY_AGENT_PIPELINE", f"{FULLNAME}-deploy-agent")
    _LEVELS = {"DEBUG": 10, "INFO": 20, "WARN": 30, "WARNING": 30, "ERROR": 40}
    _MIN = _LEVELS.get(LOG_LEVEL, 20)

    SA = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    CA = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    API = "https://kubernetes.default.svc"
    ctx = ssl.create_default_context(cafile=CA)

    STATE = {
        "ready": False,
        "last_poll_ok": False,
        "last_poll_at": None,
        "last_error": None,
        "cycles": 0,
        "agents_seen": 0,
        "devworkspaces_seen": 0,
        "ai_services_seen": 0,
    }

    # Avoid re-triggering builds every poll
    BUILD_STARTED = {}
    GIT_REPO = os.environ.get(
        "GIT_REPO",
        "https://github.com/maximilianoPizarro/rhdh-agent-sandbox.git",
    )
    GIT_REVISION = os.environ.get("GIT_REVISION", "main")
    ROUTER_BASE = os.environ.get("CLUSTER_ROUTER_BASE", "").strip()
    DEVSPACES_START_ON_CREATE = os.environ.get("DEVSPACES_START_ON_CREATE", "false").lower() in ("true", "1", "yes")
    DEVSPACES_MEMORY_REQUEST = os.environ.get("DEVSPACES_MEMORY_REQUEST", "512Mi")
    DEVSPACES_MEMORY_LIMIT = os.environ.get("DEVSPACES_MEMORY_LIMIT", "3Gi")
    CHE_CODE_DWT_NAME = os.environ.get("CHE_CODE_DWT", f"{FULLNAME}-che-code")

    def log(level, msg, **fields):
        lvl = level.upper()
        if _LEVELS.get(lvl, 20) < _MIN:
            return
        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        parts = [f"{k}={v}" for k, v in fields.items() if v is not None and v != ""]
        extra = (" " + " ".join(parts)) if parts else ""
        print(f"{ts} {lvl} {msg}{extra}", flush=True)

    def agent_base_url(name):
        if ROUTER_BASE:
            return f"https://{name}-{NS}.{ROUTER_BASE}"
        return f"http://{name}:8080"

    def service_name_for_entity(kind, name):
        if kind == "api":
            for suffix in ("-agent", "-http"):
                if name.endswith(suffix):
                    return name[: -len(suffix)]
        return name

    def ensure_route(name):
        path = f"/apis/route.openshift.io/v1/namespaces/{NS}/routes/{name}"
        body = {
            "apiVersion": "route.openshift.io/v1",
            "kind": "Route",
            "metadata": {
                "name": name,
                "namespace": NS,
                "labels": {
                    "app.kubernetes.io/name": name,
                    "app.kubernetes.io/part-of": FULLNAME,
                },
            },
            "spec": {
                "to": {"kind": "Service", "name": name, "weight": 100},
                "port": {"targetPort": "http"},
                "tls": {
                    "termination": "edge",
                    "insecureEdgeTerminationPolicy": "Redirect",
                },
            },
        }
        code, _existing = k8s("GET", path)
        if code == 404:
            c, resp = k8s("POST", f"/apis/route.openshift.io/v1/namespaces/{NS}/routes", body)
            if 200 <= c < 300:
                log("INFO", "route_created", name=name, url=agent_base_url(name))
            else:
                log("ERROR", "route_create_failed", name=name, status=c, error=_k8s_err(resp))
        elif code not in (200, 201):
            log("WARN", "route_get_failed", name=name, status=code)

    def k8s(method, path, body=None, raw=None, content_type="application/json"):
        data = raw
        headers = {
            "Authorization": f"Bearer {SA}",
            "Accept": "application/json",
        }
        if raw is not None:
            headers["Content-Type"] = content_type
        elif body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = content_type
        req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=120) as resp:
                raw_body = resp.read().decode() or "{}"
                return resp.status, json.loads(raw_body) if raw_body else {}
        except urllib.error.HTTPError as e:
            raw_body = e.read().decode() if e.fp else ""
            try:
                payload = json.loads(raw_body) if raw_body else {}
            except Exception:
                payload = {"message": raw_body}
            return e.code, payload

    def _k8s_err(body):
        if not isinstance(body, dict):
            return str(body)[:300]
        msg = body.get("message") or body.get("reason") or ""
        details = body.get("details") or {}
        causes = details.get("causes") or []
        if causes:
            msg = msg + " " + ";".join(
                (c.get("message") or c.get("reason") or str(c)) for c in causes[:3]
            )
        return (msg or json.dumps(body)[:300]).replace("\n", " ")[:400]

    def catalog_entities(annotation_key):
        req = urllib.request.Request(
            f"{CATALOG}/api/catalog/entities?filter=kind=component,metadata.annotations.{annotation_key}=true",
            headers={"Authorization": f"Bearer {TOKEN}", "Accept": "application/json"},
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                data = json.loads(resp.read().decode())
                if not isinstance(data, list):
                    log("WARN", "catalog_unexpected_payload", type=type(data).__name__, filter=annotation_key)
                    return [], "unexpected payload type"
                return data, None
        except Exception as exc:
            log("ERROR", "catalog_poll_error", error=repr(exc), catalog=CATALOG, filter=annotation_key)
            return [], str(exc)

    def catalog_agents():
        return catalog_entities("rhdh-agent-sandbox.io/managed-agent")

    def catalog_devworkspaces():
        return catalog_entities("rhdh-agent-sandbox.io/managed-devworkspace")

    def catalog_ai_services():
        return catalog_entities("rhdh-agent-sandbox.io/managed-ai-service")

    REGISTERED_CM = os.environ.get("REGISTERED_CATALOG_CM", f"{FULLNAME}-registered-catalog")
    REGISTERED_MOUNT = os.environ.get(
        "REGISTERED_CATALOG_MOUNT",
        "/opt/app-root/src/scaffolder-registered/entities",
    )
    PENDING_LABEL = "rhdh-agent-sandbox.io/pending-catalog-entity"

    def _parse_quantity(value, kind="memory"):
        if value is None:
            return 0
        s = str(value).strip()
        if not s:
            return 0
        if kind == "cpu":
            if s.endswith("m"):
                return int(s[:-1] or "0")
            try:
                return int(float(s) * 1000)
            except ValueError:
                return 0
        mult = 1
        if s.endswith("Ki"):
            mult = 1024
            s = s[:-2]
        elif s.endswith("Mi"):
            mult = 1024 ** 2
            s = s[:-2]
        elif s.endswith("Gi"):
            mult = 1024 ** 3
            s = s[:-2]
        elif s.endswith("K"):
            mult = 1000
            s = s[:-1]
        elif s.endswith("M"):
            mult = 1000 ** 2
            s = s[:-1]
        elif s.endswith("G"):
            mult = 1000 ** 3
            s = s[:-1]
        try:
            return int(float(s) * mult)
        except ValueError:
            return 0

    def quota_allows(cpu_millicores=200, memory_bytes=536870912, extra_pods=1, extra_pvcs=0):
        """Conservative namespace quota gate before creating DW/agents."""
        code, body = k8s("GET", f"/api/v1/namespaces/{NS}/resourcequotas")
        if code != 200:
            return True
        items = body.get("items") or []
        if not items:
            return True
        for rq in items:
            hard = (rq.get("status") or {}).get("hard") or (rq.get("spec") or {}).get("hard") or {}
            used = (rq.get("status") or {}).get("used") or {}
            if not hard:
                continue
            for key, need_raw, kind in (
                ("limits.cpu", cpu_millicores, "cpu"),
                ("requests.cpu", cpu_millicores, "cpu"),
                ("limits.memory", memory_bytes, "memory"),
                ("requests.memory", memory_bytes, "memory"),
            ):
                if key not in hard:
                    continue
                cap = _parse_quantity(hard.get(key), kind)
                cur = _parse_quantity(used.get(key), kind)
                need = need_raw if isinstance(need_raw, int) else _parse_quantity(need_raw, kind)
                if cap and cur + need > cap:
                    log("WARN", "quota_blocked", resource=key, used=used.get(key), hard=hard.get(key), need=need)
                    return False
            if "pods" in hard:
                cap = int(str(hard.get("pods")))
                cur = int(str(used.get("pods", "0")))
                if cap and cur + extra_pods > cap:
                    log("WARN", "quota_blocked", resource="pods", used=cur, hard=cap, need=extra_pods)
                    return False
            if extra_pvcs and "persistentvolumeclaims" in hard:
                cap = int(str(hard.get("persistentvolumeclaims")))
                cur = int(str(used.get("persistentvolumeclaims", "0")))
                if cap and cur + extra_pvcs > cap:
                    log("WARN", "quota_blocked", resource="persistentvolumeclaims", used=cur, hard=cap, need=extra_pvcs)
                    return False
        return True

    def devworkspace_template_ready():
        code, _body = k8s(
            "GET",
            f"/apis/workspace.devfile.io/v1alpha2/namespaces/{NS}/devworkspacetemplates/{CHE_CODE_DWT_NAME}",
        )
        return code == 200

    def catalog_refresh():
        body = json.dumps(
            {"entityRef": "location:default/registered-catalog-entities"}
        ).encode()
        req = urllib.request.Request(
            f"{CATALOG}/api/catalog/refresh",
            data=body,
            method="POST",
            headers={
                "Authorization": f"Bearer {TOKEN}",
                "Content-Type": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(req, timeout=60) as resp:
                return resp.status, None
        except Exception as exc:
            return 0, str(exc)

    def process_pending_catalog_entities():
        path = f"/api/v1/namespaces/{NS}/configmaps?labelSelector={PENDING_LABEL}=true"
        status, body = k8s("GET", path)
        if status != 200:
            log("WARN", "pending_catalog_list_failed", status=status, body=_k8s_err(body))
            return 0, 0
        registered = errors = 0
        for cm in body.get("items") or []:
            meta = cm.get("metadata") or {}
            cm_name = meta.get("name", "")
            labels = dict(meta.get("labels") or {})
            if labels.get("rhdh-agent-sandbox.io/catalog-registered") == "true":
                continue
            data = cm.get("data") or {}
            entity_yaml = data.get("entity.yaml", "")
            if not entity_yaml.strip():
                log("WARN", "pending_catalog_empty", configmap=cm_name)
                errors += 1
                continue
            import re
            # Support multi-doc entity.yaml (e.g. API + Component) as separate registered keys.
            docs = [d.strip() for d in re.split(r"\n---\n", entity_yaml) if d.strip()]
            if not docs:
                log("WARN", "pending_catalog_empty", configmap=cm_name)
                errors += 1
                continue
            st, reg_body = k8s(
                "GET",
                f"/api/v1/namespaces/{NS}/configmaps/{REGISTERED_CM}",
            )
            if st not in (200, 404):
                log("ERROR", "registered_catalog_get_failed", status=st, body=_k8s_err(reg_body))
                errors += 1
                continue
            patch_data = dict((reg_body.get("data") or {}) if st == 200 else {})
            doc_ok = 0
            for doc in docs:
                api_m = re.search(r"^apiVersion:\s+\S+", doc, re.MULTILINE)
                kind_m = re.search(r"^kind:\s+(\w+)", doc, re.MULTILINE)
                name_m = re.search(r"^\s+name:\s+(\S+)", doc, re.MULTILINE)
                if not api_m or not kind_m or not name_m:
                    log("WARN", "pending_catalog_invalid_entity_yaml", configmap=cm_name)
                    errors += 1
                    continue
                ent_name = name_m.group(1)
                ent_kind = kind_m.group(1).lower()
                doc = doc.replace("__RELEASE_NAMESPACE__", NS)
                doc = doc.replace(
                    "__AGENT_BASE_URL__",
                    agent_base_url(service_name_for_entity(ent_kind, ent_name)),
                )
                if "backstage.io/kubernetes-namespace:" not in doc:
                    if "      annotations:\n" in doc:
                        doc = doc.replace(
                            "      annotations:\n",
                            f"      annotations:\n        backstage.io/kubernetes-namespace: {NS}\n",
                            1,
                        )
                    elif "  annotations:\n" in doc:
                        doc = doc.replace(
                            "  annotations:\n",
                            f"  annotations:\n    backstage.io/kubernetes-namespace: {NS}\n",
                            1,
                        )
                if (
                    ent_kind == "component"
                    and "janus-idp.io/tekton:" not in doc
                    and "backstage.io/kubernetes-label-selector:" in doc
                ):
                    # Mirror label selector for Tekton CI tab when missing.
                    m = re.search(
                        r'backstage\.io/kubernetes-label-selector:\s*"([^"]+)"',
                        doc,
                    )
                    if m and ("      annotations:\n" in doc or "  annotations:\n" in doc):
                        needle = "      annotations:\n" if "      annotations:\n" in doc else "  annotations:\n"
                        indent = "        " if needle.startswith("      ") else "    "
                        doc = doc.replace(
                            needle,
                            f"{needle}{indent}janus-idp.io/tekton: \"{m.group(1)}\"\n",
                            1,
                        )
                key = f"{ent_kind}-{ent_name}.yaml"
                patch_data[key] = doc
                log("INFO", "catalog_entity_registered", name=ent_name, kind=ent_kind, key=key)
                doc_ok += 1
            if doc_ok == 0:
                continue
            if st == 404:
                st_post, post_body = k8s(
                    "POST",
                    f"/api/v1/namespaces/{NS}/configmaps",
                    {
                        "apiVersion": "v1",
                        "kind": "ConfigMap",
                        "metadata": {"name": REGISTERED_CM},
                        "data": patch_data,
                    },
                )
                if st_post not in (200, 201):
                    log("ERROR", "registered_catalog_create_failed", status=st_post, body=_k8s_err(post_body))
                    errors += 1
                    continue
            else:
                st_patch, patch_body = k8s(
                    "PATCH",
                    f"/api/v1/namespaces/{NS}/configmaps/{REGISTERED_CM}",
                    {"data": patch_data},
                    content_type="application/merge-patch+json",
                )
                if st_patch not in (200, 201):
                    log("ERROR", "registered_catalog_patch_failed", status=st_patch, body=_k8s_err(patch_body))
                    errors += 1
                    continue
            st_refresh, refresh_err = catalog_refresh()
            if st_refresh not in (200, 202):
                log(
                    "WARN",
                    "pending_catalog_refresh_incomplete",
                    configmap=cm_name,
                    status=st_refresh,
                    error=refresh_err,
                )
                errors += 1
                continue
            label_patch = {
                "metadata": {
                    "labels": {
                        PENDING_LABEL: None,
                        "rhdh-agent-sandbox.io/catalog-registered": "true",
                    }
                }
            }
            st_lbl, lbl_body = k8s(
                "PATCH",
                f"/api/v1/namespaces/{NS}/configmaps/{cm_name}",
                label_patch,
                content_type="application/merge-patch+json",
            )
            if st_lbl not in (200, 201):
                log("WARN", "pending_catalog_label_patch_failed", configmap=cm_name, status=st_lbl, body=_k8s_err(lbl_body))
            registered += doc_ok
        return registered, errors

    FRAMEWORK = {
        "python": "langgraph",
        "nodejs": "langchain-js",
        "quarkus": "langchain4j",
    }

    def substitute(text, name, language, framework, model, agent_type, spec):
        # Escape for JS String.raw / Python triple-quoted defaults: keep as plain text
        repl = {
            "${{"{{"}} values.name }}": name,
            "${{"{{"}} values.language }}": language,
            "${{"{{"}} values.framework }}": framework,
            "${{"{{"}} values.model }}": model,
            "${{"{{"}} values.agentType }}": agent_type,
            "${{"{{"}} values.agentSpec }}": spec,
            "${{"{{"}} values.owner }}": "group:default/developers",
        }
        out = text
        for k, v in repl.items():
            out = out.replace(k, v)
        return out

    def key_to_path(key, language):
        # python---app---main.py -> app/main.py (--- separator avoids __init__.py clash)
        prefix = language + "---"
        if not key.startswith(prefix):
            return None
        rest = key[len(prefix):]
        return rest.replace("---", "/")

    def load_sources(language, name, framework, model, agent_type, spec):
        code, body = k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{SOURCES_CM}")
        if code != 200:
            log("ERROR", "sources_cm_missing", status=code, name=SOURCES_CM, error=_k8s_err(body))
            return None
        data = body.get("data") or {}
        files = {}
        for key, content in data.items():
            path = key_to_path(key, language)
            if not path:
                continue
            files[path] = substitute(content, name, language, framework, model, agent_type, spec)
        if not files:
            log("ERROR", "sources_empty", language=language)
            return None
        return files

    def tar_bytes(files):
        buf = io.BytesIO()
        with tarfile.open(fileobj=buf, mode="w") as tar:
            for path, content in sorted(files.items()):
                raw = content.encode("utf-8")
                info = tarfile.TarInfo(name=path)
                info.size = len(raw)
                info.mtime = int(time.time())
                tar.addfile(info, io.BytesIO(raw))
        return buf.getvalue()

    def ensure_imagestream(name):
        code, body = k8s("GET", f"/apis/image.openshift.io/v1/namespaces/{NS}/imagestreams/{name}")
        if code == 200:
            return True
        if code != 404:
            log("ERROR", "imagestream_get_failed", name=name, status=code, error=_k8s_err(body))
            return False
        is_obj = {
            "apiVersion": "image.openshift.io/v1",
            "kind": "ImageStream",
            "metadata": {
                "name": name,
                "namespace": NS,
                "labels": {"app.kubernetes.io/name": name, "app.kubernetes.io/part-of": FULLNAME},
            },
        }
        c, b = k8s("POST", f"/apis/image.openshift.io/v1/namespaces/{NS}/imagestreams", is_obj)
        if 200 <= c < 300:
            log("INFO", "imagestream_created", name=name)
            return True
        log("ERROR", "imagestream_create_failed", name=name, status=c, error=_k8s_err(b))
        return False

    def ensure_buildconfig(name, language):
        code, body = k8s("GET", f"/apis/build.openshift.io/v1/namespaces/{NS}/buildconfigs/{name}")
        limits = {"cpu": "1", "memory": "1Gi"}
        requests = {"cpu": "100m", "memory": "256Mi"}
        if language == "quarkus":
            limits = {"cpu": "1", "memory": "2Gi"}
            requests = {"cpu": "200m", "memory": "512Mi"}
        desired = {
            "apiVersion": "build.openshift.io/v1",
            "kind": "BuildConfig",
            "metadata": {
                "name": name,
                "namespace": NS,
                "labels": {
                    "app.kubernetes.io/name": name,
                    "app.kubernetes.io/part-of": FULLNAME,
                    "rhdh-agent-sandbox.io/language": language,
                },
            },
            "spec": {
                "runPolicy": "Serial",
                "successfulBuildsHistoryLimit": 2,
                "failedBuildsHistoryLimit": 3,
                "source": {"type": "Binary", "binary": {}},
                "strategy": {
                    "type": "Docker",
                    "dockerStrategy": {"dockerfilePath": "Containerfile"},
                },
                "output": {"to": {"kind": "ImageStreamTag", "name": f"{name}:latest"}},
                "resources": {"limits": limits, "requests": requests},
            },
        }
        if code == 404:
            c, b = k8s("POST", f"/apis/build.openshift.io/v1/namespaces/{NS}/buildconfigs", desired)
            if 200 <= c < 300:
                log("INFO", "buildconfig_created", name=name, language=language)
                return True
            log("ERROR", "buildconfig_create_failed", name=name, status=c, error=_k8s_err(b))
            return False
        if 200 <= code < 300:
            return True
        log("ERROR", "buildconfig_get_failed", name=name, status=code, error=_k8s_err(body))
        return False

    def imagestream_has_image(name):
        code, body = k8s("GET", f"/apis/image.openshift.io/v1/namespaces/{NS}/imagestreamtags/{name}:latest")
        if code != 200:
            return False
        if body.get("image"):
            return True
        tag = body.get("tag") or {}
        items = tag.get("items") or []
        return len(items) > 0

    def agent_spec_hash(language, framework, model, agent_type, spec):
        return hashlib.sha256(
            f"{language}|{framework}|{model}|{agent_type}|{spec}".encode()
        ).hexdigest()[:12]

    def built_deployment_hash(language, framework, model, agent_type, spec):
        agent_log_level = os.environ.get("AGENT_LOG_LEVEL", LOG_LEVEL)
        return hashlib.sha256(
            f"build|{language}|{framework}|{model}|{spec}|{agent_type}|{agent_log_level}|{FULLNAME}".encode()
        ).hexdigest()[:16]

    def dns1123_name(*parts, max_len=63):
        raw = "-".join(str(part or "") for part in parts).lower()
        safe = re.sub(r"[^a-z0-9-]+", "-", raw).strip("-")
        safe = re.sub(r"-{2,}", "-", safe)
        safe = safe[:max_len].rstrip("-")
        return safe or "deploy-agent"

    def list_agent_pipelineruns(name):
        sel = urllib.parse.quote(f"app.kubernetes.io/name={name}", safe="=,")
        code, body = k8s(
            "GET",
            f"/apis/tekton.dev/v1/namespaces/{NS}/pipelineruns?labelSelector={sel}",
        )
        if code != 200:
            log("ERROR", "pipelinerun_list_failed", name=name, status=code, error=_k8s_err(body))
            return None
        items = body.get("items") or []
        items.sort(
            key=lambda pr: (
                (pr.get("status") or {}).get("completionTime")
                or (pr.get("status") or {}).get("startTime")
                or (pr.get("metadata") or {}).get("creationTimestamp", "")
            ),
            reverse=True,
        )
        return items

    def pipelinerun_condition(pr):
        status = pr.get("status") or {}
        for cond in status.get("conditions") or []:
            if cond.get("type") == "Succeeded":
                cond_status = cond.get("status")
                reason = cond.get("reason", "")
                if cond_status == "True":
                    return "Succeeded", reason
                if cond_status == "False":
                    return "Failed", reason
                if cond_status == "Unknown":
                    if "cancel" in reason.lower():
                        return "Failed", reason
                    return "Running", reason
        if status.get("completionTime"):
            return "Failed", ""
        if status.get("startTime"):
            return "Running", ""
        return "Pending", ""

    def start_deploy_pipelinerun(name, language, model, agent_type, spec, spec_hash):
        image = image_ref(name)
        hash8 = spec_hash[:8]
        pr_name = dns1123_name("deploy", name, hash8)
        body = {
            "apiVersion": "tekton.dev/v1",
            "kind": "PipelineRun",
            "metadata": {
                "name": pr_name,
                "namespace": NS,
                "labels": {
                    "app.kubernetes.io/name": name,
                    "app.kubernetes.io/part-of": FULLNAME,
                    "rhdh-agent-sandbox.io/spec-hash": spec_hash,
                },
            },
            "spec": {
                "pipelineRef": {"name": DEPLOY_PIPELINE},
                "taskRunTemplate": {"serviceAccountName": "pipeline"},
                "params": [
                    {"name": "name", "value": name},
                    {"name": "language", "value": language},
                    {"name": "namespace", "value": NS},
                    {"name": "model", "value": model},
                    {"name": "agent-type", "value": agent_type},
                    {"name": "agent-spec", "value": spec},
                    {"name": "image", "value": image},
                ],
                "workspaces": [{
                    "name": "source",
                    "volumeClaimTemplate": {
                        "spec": {
                            "accessModes": ["ReadWriteOnce"],
                            "resources": {"requests": {"storage": "1Gi"}},
                        }
                    },
                }],
            },
        }
        c, b = k8s("POST", f"/apis/tekton.dev/v1/namespaces/{NS}/pipelineruns", body)
        if 200 <= c < 300:
            log("INFO", "pipelinerun_started", name=name, pipelinerun=pr_name, pipeline=DEPLOY_PIPELINE, spec_hash=spec_hash)
            return "started"
        if c == 409:
            retry_name = dns1123_name("deploy", name, hash8, str(int(time.time()))[-6:])
            body["metadata"]["name"] = retry_name
            c, b = k8s("POST", f"/apis/tekton.dev/v1/namespaces/{NS}/pipelineruns", body)
            if 200 <= c < 300:
                log("INFO", "pipelinerun_started", name=name, pipelinerun=retry_name, pipeline=DEPLOY_PIPELINE, spec_hash=spec_hash)
                return "started"
        log("ERROR", "pipelinerun_start_failed", name=name, status=c, error=_k8s_err(b))
        return "error"

    def deployment_ready(deploy):
        status = deploy.get("status") or {}
        meta = deploy.get("metadata") or {}
        observed = status.get("observedGeneration", 0)
        generation = meta.get("generation", 0)
        return (
            observed >= generation
            and (status.get("readyReplicas") or 0) >= 1
            and (status.get("availableReplicas") or 0) >= 1
        )

    def ensure_tekton_agent(name, language, framework, model, agent_type, spec):
        spec_hash = agent_spec_hash(language, framework, model, agent_type, spec)
        runs = list_agent_pipelineruns(name)
        if runs is None:
            return "error"

        for pr in runs:
            labels = ((pr.get("metadata") or {}).get("labels") or {})
            pr_hash = labels.get("rhdh-agent-sandbox.io/spec-hash", "")
            state, reason = pipelinerun_condition(pr)
            pr_name = (pr.get("metadata") or {}).get("name", "?")
            if state in ("Running", "Pending"):
                log("INFO", "pipelinerun_in_progress", name=name, pipelinerun=pr_name, reason=reason or state)
                return "building"
            if state == "Failed" and (not pr_hash or pr_hash == spec_hash):
                log(
                    "WARN",
                    "pipelinerun_failed_blocked",
                    name=name,
                    pipelinerun=pr_name,
                    reason=reason or state,
                    spec_hash=spec_hash,
                )
                return "failed"
            if pr_hash == spec_hash and state == "Succeeded":
                code, deploy = k8s("GET", f"/apis/apps/v1/namespaces/{NS}/deployments/{name}")
                if code == 404:
                    return ensure_built_deployment(name, language, framework, model, agent_type, spec)
                if not (200 <= code < 300):
                    log("ERROR", "deployment_get_failed", name=name, status=code, error=_k8s_err(deploy))
                    return "error"
                desired_hash = built_deployment_hash(language, framework, model, agent_type, spec)
                current_hash = (deploy.get("metadata") or {}).get("annotations", {}).get("rhdh-agent-sandbox.io/applier-hash")
                if current_hash != desired_hash or not deployment_ready(deploy):
                    return ensure_built_deployment(name, language, framework, model, agent_type, spec)
                return "unchanged"

        result = start_deploy_pipelinerun(name, language, model, agent_type, spec, spec_hash)
        if result == "error":
            return "error"
        return "building"

    def latest_build_phase(name):
        code, body = k8s(
            "GET",
            f"/apis/build.openshift.io/v1/namespaces/{NS}/builds?labelSelector=buildconfig={name}&limit=5",
        )
        if code != 200:
            return None
        items = body.get("items") or []
        if not items:
            return None
        items.sort(key=lambda b: b.get("metadata", {}).get("creationTimestamp", ""), reverse=True)
        return (items[0].get("status") or {}).get("phase")

    def start_binary_build(name, language, framework, model, agent_type, spec):
        key = f"{name}|{language}|{model}|{agent_type}|{hashlib.sha256(spec.encode()).hexdigest()[:12]}"
        phase = latest_build_phase(name)
        if phase in ("New", "Pending", "Running"):
            log("INFO", "build_in_progress", name=name, phase=phase)
            return "building"
        if BUILD_STARTED.get(name) == key and phase not in ("Failed", "Error", "Cancelled", None):
            return "skipped"
        files = load_sources(language, name, framework, model, agent_type, spec)
        if not files:
            return "error"
        archive = tar_bytes(files)
        path = f"/apis/build.openshift.io/v1/namespaces/{NS}/buildconfigs/{name}/instantiatebinary?asFile="
        # OpenShift expects a tar archive body
        c, b = k8s(
            "POST",
            path,
            raw=archive,
            content_type="application/tar",
        )
        if 200 <= c < 300:
            BUILD_STARTED[name] = key
            build_name = (b.get("metadata") or {}).get("name", "?")
            log("INFO", "build_started", name=name, build=build_name, language=language, bytes=len(archive))
            return "started"
        log("ERROR", "build_start_failed", name=name, status=c, error=_k8s_err(b))
        return "error"

    def image_ref(name):
        # In-cluster pull through image-registry
        return f"image-registry.openshift-image-registry.svc:5000/{NS}/{name}:latest"

    def ensure_built_deployment(name, language, framework, model, agent_type, spec):
        agent_log_level = os.environ.get("AGENT_LOG_LEVEL", LOG_LEVEL)
