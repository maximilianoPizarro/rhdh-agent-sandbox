            c, body = k8s("POST", f"/api/v1/namespaces/{NS}/services", svc)
            if not (200 <= c < 300):
                log("ERROR", "ai_service_svc_failed", name=name, status=c, error=_k8s_err(body))
                return "error"
        ensure_route(name)
        return action

    def ensure_devworkspace(entity):
        meta = entity.get("metadata", {})
        ann = meta.get("annotations") or {}
        name = meta.get("name")
        if not name:
            log("WARN", "skip_nameless_devworkspace")
            return "skip"
        language = ann.get("rhdh-agent-sandbox.io/language", "python")
        if language not in FRAMEWORK:
            language = "python"
        framework = ann.get("rhdh-agent-sandbox.io/framework") or FRAMEWORK.get(language, "langgraph")
        model = ann.get("rhdh-agent-sandbox.io/model", "granite")
        if not quota_allows(cpu_millicores=200, memory_bytes=_parse_quantity(DEVSPACES_MEMORY_REQUEST), extra_pods=1):
            log("WARN", "devworkspace_quota_blocked", name=name)
            return "skip"
        if not devworkspace_template_ready():
            log(
                "WARN",
                "devworkspace_template_missing",
                name=name,
                template=CHE_CODE_DWT_NAME,
                hint="wait for chart install or helm upgrade to recreate DevWorkspaceTemplate",
            )
            return "skip"
        che_code_dwt = CHE_CODE_DWT_NAME
        desired_hash = hashlib.sha256(f"{language}|{framework}|{model}|{GIT_REPO}|{GIT_REVISION}|editor:{che_code_dwt}".encode()).hexdigest()[:16]

        path = f"/apis/workspace.devfile.io/v1alpha2/namespaces/{NS}/devworkspaces/{name}"
        code, existing = k8s("GET", path)
        if code == 200:
            current_hash = (existing.get("metadata") or {}).get("annotations", {}).get("rhdh-agent-sandbox.io/applier-hash")
            if current_hash == desired_hash:
                return "unchanged"
            # Do not mutate user-stopped workspaces; leave existing as-is after first create
            log("INFO", "devworkspace_exists", name=name, language=language, hash=current_hash)
            return "unchanged"
        if code not in (404,):
            log("ERROR", "devworkspace_get_failed", name=name, status=code, error=_k8s_err(existing))
            return "error"

        download_cmd = (
            "set -euo pipefail\n"
            "OUT=/tmp/continue.vsix\n"
            'if [[ -s "${OUT}" ]]; then echo "Continue vsix present"; exit 0; fi\n'
            'META_URL="https://open-vsx.org/api/Continue/continue/linux-x64/latest"\n'
            "URL=\"$(curl -fsSL \"${META_URL}\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"files\"][\"download\"])')\"\n"
            'curl -fsSL --retry 3 --retry-delay 2 -o "${OUT}.partial" "${URL}"\n'
            'mv "${OUT}.partial" "${OUT}"\n'
            'echo "Wrote ${OUT}"\n'
        )
        ensure_cmd = (
            "set -euo pipefail\n"
            "OUT=/tmp/continue.vsix\n"
            'SOCK=""\n'
            "for _ in $(seq 1 45); do\n"
            '  SOCK="$(ls /tmp/vscode-ipc-*.sock 2>/dev/null | head -1 || true)"\n'
            '  [[ -n "${SOCK}" ]] && break\n'
            "  sleep 2\n"
            "done\n"
            '[[ -z "${SOCK}" || ! -s "${OUT}" ]] && exit 0\n'
            'export VSCODE_IPC_HOOK_CLI="${SOCK}"\n'
            'CODE="$(command -v code-oss || true)"\n'
            '[[ -z "${CODE}" ]] && CODE="/checode/checode-linux-libc/ubi9/bin/remote-cli/code-oss"\n'
            '[[ ! -x "${CODE}" ]] && exit 0\n'
            "\"${CODE}\" --list-extensions 2>/dev/null | grep -qi '^continue.continue' && exit 0\n"
            "\"${CODE}\" --install-extension \"${OUT}\" || true\n"
        )
        wire_cmd = (
            "set -euo pipefail\n"
            "SCRIPT=/opt/rhdh-agent-sandbox/wire-continue.py\n"
            "for _ in $(seq 1 15); do\n"
            '  [[ -f "${SCRIPT}" ]] && break\n'
            "  sleep 2\n"
            "done\n"
            'if [[ ! -f "${SCRIPT}" ]]; then\n'
            '  echo "wire-continue.py not mounted; ensure ConfigMap ' + FULLNAME + '-wire-continue exists"\n'
            "  exit 0\n"
            "fi\n"
            'python3 "${SCRIPT}"\n'
        )
        auth_cmd = (
            "set -euo pipefail\n"
            "for CAND in "
            '"$HOME/.local/share/rhdh-agent-sandbox/wire-continue.py" '
            "/opt/rhdh-agent-sandbox/wire-continue.py; do\n"
            '  if [[ -f "${CAND}" ]] && grep -q -- \'--auth-rh-security\' "${CAND}"; then\n'
            '    exec python3 "${CAND}" --auth-rh-security\n'
            "  fi\n"
            "done\n"
            'echo "wire-continue.py --auth-rh-security not found. Run Devfile command wire-continue first."\n'
            "exit 1\n"
        )

        dw = {
            "apiVersion": "workspace.devfile.io/v1alpha2",
            "kind": "DevWorkspace",
            "metadata": {
                "name": name,
                "namespace": NS,
                "labels": {
                    "app.kubernetes.io/name": name,
                    "app.kubernetes.io/component": "agent-devspaces",
                    "app.kubernetes.io/part-of": FULLNAME,
                    "rhdh-agent-sandbox.io/language": language,
                    "rhdh-agent-sandbox.io/golden-path": "devspaces",
                },
                "annotations": {
                    "che.eclipse.org/che-editor": "che-incubator/che-code/latest",
                    "rhdh-agent-sandbox.io/applier-hash": desired_hash,
                    "rhdh-agent-sandbox.io/language": language,
                    "rhdh-agent-sandbox.io/model": model,
                },
            },
            "spec": {
                "started": DEVSPACES_START_ON_CREATE,
                "routingClass": "che",
                "contributions": [
                    {"name": "editor", "kubernetes": {"name": che_code_dwt}},
                ],
                "template": {
                    "attributes": {"controller.devfile.io/storage-type": "per-user"},
                    "projects": [{
                        "name": "agent-sandbox",
                        "git": {
                            "remotes": {"origin": GIT_REPO},
                            "checkoutFrom": {"revision": GIT_REVISION},
                        },
                    }],
                    "components": [{
                        "name": "tools",
                        "container": {
                            "image": "quay.io/devfile/universal-developer-image:ubi9-latest",
                            "memoryLimit": DEVSPACES_MEMORY_LIMIT,
                            "memoryRequest": DEVSPACES_MEMORY_REQUEST,
                            "cpuLimit": "2",
                            "cpuRequest": "200m",
                            "mountSources": True,
                            "endpoints": [
                                {"name": "http-8080", "targetPort": 8080, "exposure": "public", "protocol": "http", "secure": True},
                            ],
                            "env": [
                                {"name": "DEFAULT_EXTENSIONS", "value": "/tmp/continue.vsix"},
                                {"name": "AGENT_LANGUAGE", "value": language},
                                {"name": "AGENT_FRAMEWORK", "value": framework},
                                {"name": "CONTINUE_DEFAULT_MODEL", "value": model},
                                {"name": "SHELL", "value": "/bin/bash"},
                            ],
                            "attributes": {"controller.devfile.io/merge-contribution": True},
                        },
                    }],
                    "commands": [
                        {"id": "download-continue-extension", "exec": {"component": "tools", "commandLine": download_cmd}},
                        {"id": "ensure-continue-extension", "exec": {"component": "tools", "commandLine": ensure_cmd}},
                        {"id": "wire-continue", "exec": {"component": "tools", "workingDir": "${PROJECT_SOURCE}", "commandLine": wire_cmd}},
                        {"id": "auth-rh-security-mcp", "exec": {"component": "tools", "commandLine": auth_cmd}},
                    ],
                    "events": {
                        "postStart": [
                            "download-continue-extension",
                            "ensure-continue-extension",
                            "wire-continue",
                        ],
                    },
                },
            },
        }

        c, b = k8s("POST", f"/apis/workspace.devfile.io/v1alpha2/namespaces/{NS}/devworkspaces", dw)
        if 200 <= c < 300:
            log("INFO", "devworkspace_created", name=name, language=language, model=model, started=True)
            return "created"
        log("ERROR", "devworkspace_create_failed", name=name, status=c, error=_k8s_err(b))
        return "error"

    def ensure(agent):
        meta = agent.get("metadata", {})
        ann = meta.get("annotations") or {}
        name = meta.get("name")
        language = ann.get("rhdh-agent-sandbox.io/language", "python")
        framework = ann.get("rhdh-agent-sandbox.io/framework") or FRAMEWORK.get(language, "langgraph")
        model = ann.get("rhdh-agent-sandbox.io/model", "granite")
        agent_type = ann.get("rhdh-agent-sandbox.io/agent-type", "tool-agent")
        spec = ann.get("rhdh-agent-sandbox.io/agent-spec", "You are a helpful namespace-scoped agent.")
        build = (ann.get("rhdh-agent-sandbox.io/build") or "").lower() in ("true", "1", "yes")
        if not name:
            log("WARN", "skip_nameless_entity")
            return "skip"

        if not build:
            return ensure_stub(agent, name, language, framework, model, spec)

        if not quota_allows(cpu_millicores=200, memory_bytes=268435456, extra_pods=1, extra_pvcs=1):
            log("WARN", "agent_quota_blocked", name=name)
            return "skip"

        if USE_TEKTON:
            # Pipeline creates BC/IS as needed; avoid blocking poll on binary builds.
            return ensure_tekton_agent(name, language, framework, model, agent_type, spec)

        if not ensure_imagestream(name) or not ensure_buildconfig(name, language):
            return "error"

        if imagestream_has_image(name):
            return ensure_built_deployment(name, language, framework, model, agent_type, spec)

        result = start_binary_build(name, language, framework, model, agent_type, spec)
        if result == "error":
            return "error"
        log("INFO", "waiting_for_image", name=name, build_result=result)
        return "building"

    class HealthHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ("/health", "/healthz", "/ready", "/readyz"):
                ok = STATE["ready"]
                code = 200 if ok else 503
                body = json.dumps({
                    "status": "ok" if ok else "starting",
                    "lastPollOk": STATE["last_poll_ok"],
                    "lastPollAt": STATE["last_poll_at"],
                    "lastError": STATE["last_error"],
                    "cycles": STATE["cycles"],
                    "agentsSeen": STATE["agents_seen"],
                    "devworkspacesSeen": STATE["devworkspaces_seen"],
                    "aiServicesSeen": STATE["ai_services_seen"],
                }).encode()
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            self.send_response(404)
            self.end_headers()

        def log_message(self, *_args):
            return

    def start_health_server():
        srv = HTTPServer(("0.0.0.0", HEALTH_PORT), HealthHandler)
        t = threading.Thread(target=srv.serve_forever, name="health", daemon=True)
        t.start()
        log("INFO", "health_server_started", port=HEALTH_PORT)

    start_health_server()
    log(
        "INFO",
        "applier_started",
        namespace=NS,
        catalog=CATALOG,
        poll_seconds=POLL_SECONDS,
        sources_cm=SOURCES_CM,
        deploy_pipeline=DEPLOY_PIPELINE,
        use_tekton=USE_TEKTON,
    )
    STATE["ready"] = True

    while True:
        cycle_started = time.monotonic()
        pending_reg, pending_err = process_pending_catalog_entities()
        agents, err = catalog_agents()
        dws, err_dw = catalog_devworkspaces()
        ais, err_ai = catalog_ai_services()
        STATE["cycles"] += 1
        STATE["last_poll_at"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        STATE["last_error"] = err or err_dw or err_ai
        STATE["last_poll_ok"] = err is None and err_dw is None and err_ai is None
        STATE["agents_seen"] = len(agents)
        STATE["devworkspaces_seen"] = len(dws)
        STATE["ai_services_seen"] = len(ais)

        created = updated = unchanged = errors = skipped = building = 0
        for ent in agents:
            try:
                result = ensure(ent)
                if result == "created":
                    created += 1
                elif result == "updated":
                    updated += 1
                elif result == "unchanged":
                    unchanged += 1
                elif result == "building":
                    building += 1
                elif result == "error":
                    errors += 1
                else:
                    skipped += 1
            except Exception as exc:
                errors += 1
                name = (ent.get("metadata") or {}).get("name", "?")
                log("ERROR", "ensure_error", name=name, error=repr(exc))

        dw_created = dw_unchanged = dw_errors = dw_skipped = 0
        for ent in dws:
            try:
                result = ensure_devworkspace(ent)
                if result == "created":
                    dw_created += 1
                elif result == "unchanged":
                    dw_unchanged += 1
                elif result == "error":
                    dw_errors += 1
                else:
                    dw_skipped += 1
            except Exception as exc:
                dw_errors += 1
                name = (ent.get("metadata") or {}).get("name", "?")
                log("ERROR", "ensure_devworkspace_error", name=name, error=repr(exc))

        ai_created = ai_updated = ai_unchanged = ai_errors = ai_skipped = 0
        for ent in ais:
            try:
                result = ensure_ai_service(ent)
                if result == "created":
                    ai_created += 1
                elif result == "updated":
                    ai_updated += 1
                elif result == "unchanged":
                    ai_unchanged += 1
                elif result == "error":
                    ai_errors += 1
                else:
                    ai_skipped += 1
            except Exception as exc:
                ai_errors += 1
                name = (ent.get("metadata") or {}).get("name", "?")
                log("ERROR", "ensure_ai_service_error", name=name, error=repr(exc))

        ms = int((time.monotonic() - cycle_started) * 1000)
        log(
            "INFO",
            "poll_cycle",
            cycle=STATE["cycles"],
            pending_registered=pending_reg,
            pending_errors=pending_err,
            agents=len(agents),
            created=created,
            updated=updated,
            unchanged=unchanged,
            building=building,
            errors=errors,
            skipped=skipped,
            devworkspaces=len(dws),
            dw_created=dw_created,
            dw_unchanged=dw_unchanged,
            dw_errors=dw_errors,
            dw_skipped=dw_skipped,
            ai_services=len(ais),
            ai_created=ai_created,
            ai_updated=ai_updated,
            ai_unchanged=ai_unchanged,
            ai_errors=ai_errors,
            duration_ms=ms,
            catalog_ok=(err is None and err_dw is None and err_ai is None),
        )
        time.sleep(POLL_SECONDS)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-applier
    app.kubernetes.io/part-of: {{ include "rhdh-agent-sandbox.fullname" . }}
    app.openshift.io/runtime: helm
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"{{ .Release.Name }}-developer-hub"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
        app.kubernetes.io/component: agent-applier
        app.kubernetes.io/part-of: {{ include "rhdh-agent-sandbox.fullname" . }}
        app.openshift.io/runtime: helm
    spec:
      serviceAccountName: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
      containers:
        - name: applier
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/applier.py"]
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FULLNAME
              value: {{ include "rhdh-agent-sandbox.fullname" . | quote }}
            - name: SECRETS_NAME
              value: {{ .Values.secrets.name | quote }}
            - name: LITELLM_PORT
              value: {{ .Values.litellm.service.port | quote }}
            - name: CATALOG_URL
              value: http://{{ .Release.Name }}-developer-hub:7007
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: mcp-token
            - name: POLL_SECONDS
              value: "45"
            - name: LOG_LEVEL
              value: {{ .Values.agents.applier.logLevel | default "INFO" | quote }}
            - name: AGENT_LOG_LEVEL
              value: {{ .Values.agents.logLevel | default "INFO" | quote }}
            - name: HEALTH_PORT
              value: "8080"
            - name: SOURCES_CM
              value: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-build-sources
            - name: GIT_REPO
              value: {{ .Values.agents.devspaces.gitRepo | default "https://github.com/maximilianoPizarro/rhdh-agent-sandbox.git" | quote }}
            - name: GIT_REVISION
              value: {{ .Values.agents.devspaces.gitRevision | default (printf "v%s" .Chart.Version) | quote }}
            - name: CHE_CODE_DWT
              value: {{ printf "%s-che-code" (include "rhdh-agent-sandbox.fullname" .) | quote }}
            - name: CLUSTER_ROUTER_BASE
              value: {{ .Values.rhdh.global.clusterRouterBase | quote }}
            - name: DEVSPACES_START_ON_CREATE
              value: {{ .Values.agents.devspaces.startOnCreate | default false | quote }}
            - name: DEVSPACES_MEMORY_REQUEST
              value: {{ .Values.agents.devspaces.memoryRequest | default "512Mi" | quote }}
            - name: DEVSPACES_MEMORY_LIMIT
              value: {{ .Values.agents.devspaces.memoryLimit | default "3Gi" | quote }}
            - name: REGISTERED_CATALOG_CM
              value: {{ include "rhdh-agent-sandbox.fullname" . }}-registered-catalog
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-applier
{{- end }}
