{{- if and .Values.agents.enabled .Values.agents.applier.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-ai-service-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
data:
  server.py: |
    import json, os, urllib.error, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    NS = os.environ.get("NAMESPACE", "")
    NAME = os.environ.get("SERVICE_NAME", "ai-service")
    MODEL = os.environ.get("MODEL", "granite")
    K8S_MCP = os.environ.get("K8S_MCP_URL", "http://rhdh-agent-sandbox-k8s-mcp:8085/mcp")
    OCP_MCP = os.environ.get("OCP_MCP_URL", "http://rhdh-agent-sandbox-mcp:8080/mcp")
    LITELLM = os.environ.get("LITELLM_API_BASE", "")

    def mcp_call(url, tool, arguments):
        headers = {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream",
        }

        def post(body, session=None):
            h = dict(headers)
            if session:
                h["Mcp-Session-Id"] = session
            req = urllib.request.Request(
                url, data=json.dumps(body).encode(), headers=h, method="POST"
            )
            try:
                with urllib.request.urlopen(req, timeout=45) as resp:
                    sess = resp.headers.get("Mcp-Session-Id") or session
                    raw = resp.read().decode()
                    return sess, raw, None
            except urllib.error.HTTPError as e:
                return session, e.read().decode() if e.fp else "", str(e)
            except Exception as e:
                return session, "", str(e)

        init = {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "initialize",
            "params": {
                "protocolVersion": "2024-11-05",
                "capabilities": {},
                "clientInfo": {"name": NAME, "version": "0.1"},
            },
        }
        sess, raw, err = post(init)
        if err and not sess:
            return {"ok": False, "tool": tool, "error": err, "raw": raw[:400]}
        post({"jsonrpc": "2.0", "id": 2, "method": "notifications/initialized"}, sess)
        call = {
            "jsonrpc": "2.0",
            "id": 3,
            "method": "tools/call",
            "params": {"name": tool, "arguments": arguments},
        }
        _sess2, raw2, err2 = post(call, sess)
        text = raw2
        if "data:" in raw2:
            for line in raw2.splitlines():
                if line.startswith("data:"):
                    text = line[5:].strip()
                    break
        try:
            payload = json.loads(text) if text.strip().startswith("{") else {"raw": text[:500]}
        except Exception:
            payload = {"raw": text[:500]}
        result = payload.get("result") or {}
        content = result.get("content") or []
        out = " ".join([(c.get("text") or "") for c in content])[:2000]
        ok = not payload.get("error") and not result.get("isError")
        return {"ok": ok, "tool": tool, "text": out, "error": payload.get("error") or err2}

    def smoke():
        return {
            "namespace": NS,
            "service": NAME,
            "model": MODEL,
            "litellm": LITELLM,
            "k8s_mcp": mcp_call(K8S_MCP, "pods_list_in_namespace", {"namespace": NS}),
            "openshift_mcp": mcp_call(OCP_MCP, "monitorDeployments", {"namespace": NS}),
        }

    class H(BaseHTTPRequestHandler):
        def _json(self, code, obj):
            body = json.dumps(obj, indent=2).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path in ("/health", "/healthz", "/ready", "/readyz"):
                self._json(200, {"status": "ok", "service": NAME})
                return
            if self.path.startswith("/mcp/smoke"):
                self._json(200, smoke())
                return
            if self.path in ("/", "/info"):
                self._json(
                    200,
                    {
                        "service": NAME,
                        "model": MODEL,
                        "namespace": NS,
                        "litellm": LITELLM,
                        "mcp": {
                            "kubernetes": K8S_MCP,
                            "openshift": OCP_MCP,
                            "smoke": "/mcp/smoke",
                            "red_hat_security": "https://security-mcp.api.redhat.com/mcp (OAuth SSO via Cursor)",
                        },
                        "hint": "GET /mcp/smoke calls pods_list_in_namespace + monitorDeployments",
                    },
                )
                return
            self.send_response(404)
            self.end_headers()

        def log_message(self, *_a):
            return

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
{{- end }}
