{{- if and .Values.litellm.enabled .Values.litellm.route.enabled }}
{{- $fullname := include "rhdh-agent-sandbox.fullname" . }}
{{- $routeHost := "" }}
{{- $route := lookup "route.openshift.io/v1" "Route" .Release.Namespace (printf "%s-litellm" $fullname) }}
{{- if and $route $route.spec $route.spec.host }}
{{- $routeHost = $route.spec.host }}
{{- else }}
{{- $routeHost = printf "%s-litellm-%s.%s" $fullname .Release.Namespace (.Values.rhdh.global.clusterRouterBase | default "apps.example.com") }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.name }}
{{- $litellm := .Values.secrets.litellmMasterKey }}
{{- $mcpToken := .Values.secrets.mcpToken }}
{{- if and (not $litellm) $existing $existing.data (index $existing.data "litellm-master-key") }}
{{- $litellm = index $existing.data "litellm-master-key" | b64dec }}
{{- end }}
{{- if and (not $mcpToken) $existing $existing.data (index $existing.data "mcp-token") }}
{{- $mcpToken = index $existing.data "mcp-token" | b64dec }}
{{- end }}
{{- if not $litellm }}{{ $litellm = "replace-after-install" }}{{ end }}
{{- $hubHost := "" }}
{{- $hubRoute := lookup "route.openshift.io/v1" "Route" .Release.Namespace (printf "%s-developer-hub" .Release.Name) }}
{{- if and $hubRoute $hubRoute.spec $hubRoute.spec.host }}
{{- $hubHost = $hubRoute.spec.host }}
{{- else }}
{{- $hubHost = printf "%s-developer-hub-%s.%s" .Release.Name .Release.Namespace (.Values.rhdh.global.clusterRouterBase | default "apps.example.com") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-continue
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: continue
    # Inject into every DevWorkspace in this namespace (Continue 2.x wire-continue)
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-secret: "true"
  annotations:
    controller.devfile.io/mount-as: env
    rhdh-agent-sandbox/purpose: "DevSpaces Continue → LiteLLM + Hub MCP (chart-managed)"
type: Opaque
stringData:
  LITELLM_API_KEY: {{ $litellm | quote }}
  LITELLM_API_BASE: {{ printf "https://%s/v1" $routeHost | quote }}
  HUB_MCP_URL: {{ printf "https://%s/api/mcp-actions/v1" $hubHost | quote }}
{{- if $mcpToken }}
  MCP_TOKEN: {{ $mcpToken | quote }}
{{- end }}
{{- end }}
