{{- $router := .Values.rhdh.global.clusterRouterBase | default "apps.example.com" }}
{{- $cluster := .Values.cluster | default dict }}
{{- $api := index $cluster "apiUrl" | default "" }}
{{- if not $api }}
{{- $api = printf "https://api.%s:6443" (trimPrefix "apps." $router) }}
{{- end }}
{{- $cname := index $cluster "name" | default "sandbox" }}
{{/*
  Public API URL for the Hub Kubernetes plugin. Derived from clusterRouterBase
  so the Console Helm form only needs the apps domain. Token comes from
  ServiceAccount rhdh-agent-sandbox-hub-k8s-reader (not a pasted user token).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-agent-sandbox-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-info
type: Opaque
stringData:
  api-url: {{ $api | quote }}
  cluster-name: {{ $cname | quote }}
  router-base: {{ $router | quote }}
  hub-route-host: {{ printf "%s-developer-hub-%s.%s" .Release.Name .Release.Namespace $router | quote }}
