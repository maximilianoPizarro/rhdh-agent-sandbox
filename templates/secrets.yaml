{{- if .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.name }}
{{- $backend := .Values.secrets.backendSecret }}
{{- $litellm := .Values.secrets.litellmMasterKey }}
{{- $modelKey := .Values.secrets.modelApiKey }}
{{- $mcpToken := .Values.secrets.mcpToken }}
{{- if and $existing $existing.data }}
{{- if not $backend }}{{ $backend = index $existing.data "backend-secret" | b64dec }}{{ end }}
{{- if not $litellm }}{{ $litellm = index $existing.data "litellm-master-key" | b64dec }}{{ end }}
{{- if not $modelKey }}{{ $modelKey = index $existing.data "model-api-key" | b64dec }}{{ end }}
{{- if and (not $mcpToken) (index $existing.data "mcp-token") }}{{ $mcpToken = index $existing.data "mcp-token" | b64dec }}{{ end }}
{{- end }}
{{- if not $backend }}{{ $backend = randAlphaNum 32 }}{{ end }}
{{- if not $litellm }}{{ $litellm = printf "sk-%s" (randAlphaNum 24) }}{{ end }}
{{- if not $modelKey }}{{ $modelKey = "replace-me" }}{{ end }}
{{- if not $mcpToken }}{{ $mcpToken = printf "mcp-%s" (randAlphaNum 32) }}{{ end }}
{{- $vllmUrl := printf "http://%s-litellm:%v/v1" (include "rhdh-agent-sandbox.fullname" .) .Values.litellm.service.port }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
type: Opaque
# Use `data` (not stringData) so Helm 3-way merge can drop removed keys (e.g. ENABLE_OPENAI).
data:
  backend-secret: {{ $backend | b64enc | quote }}
  litellm-master-key: {{ $litellm | b64enc | quote }}
  model-api-key: {{ $modelKey | b64enc | quote }}
  # Static token for RHDH MCP actions (/api/mcp-actions/v1) used by Lightspeed Core.
  mcp-token: {{ $mcpToken | b64enc | quote }}
  # Lightspeed-core: only vLLM/OpenAI-compatible provider → LiteLLM. Do not set ENABLE_OPENAI.
  ENABLE_VLLM: {{ "true" | b64enc | quote }}
  VLLM_URL: {{ $vllmUrl | b64enc | quote }}
  VLLM_API_KEY: {{ $litellm | b64enc | quote }}
  VLLM_TLS_VERIFY: {{ "false" | b64enc | quote }}
{{- end }}
