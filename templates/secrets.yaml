{{- if .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.name }}
{{- $backend := .Values.secrets.backendSecret }}
{{- $mcp := .Values.secrets.mcpToken }}
{{- $litellm := .Values.secrets.litellmMasterKey }}
{{- if and $existing $existing.data }}
{{- if not $backend }}{{ $backend = index $existing.data "backend-secret" | b64dec }}{{ end }}
{{- if not $mcp }}{{ $mcp = index $existing.data "mcp-token" | b64dec }}{{ end }}
{{- if not $litellm }}{{ $litellm = index $existing.data "litellm-master-key" | b64dec }}{{ end }}
{{- end }}
{{- if not $backend }}{{ $backend = randAlphaNum 32 }}{{ end }}
{{- if not $mcp }}{{ $mcp = randAlphaNum 32 }}{{ end }}
{{- if not $litellm }}{{ $litellm = printf "sk-%s" (randAlphaNum 24) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  backend-secret: {{ $backend | quote }}
  mcp-token: {{ $mcp | quote }}
  litellm-master-key: {{ $litellm | quote }}
  model-api-key: {{ .Values.secrets.modelApiKey | default "replace-me" | quote }}
  ENABLE_OPENAI: "openai"
  OPENAI_API_KEY: {{ $litellm | quote }}
  OPENAI_BASE_URL: {{ printf "http://%s-litellm:%v/v1" (include "rhdh-agent-sandbox.fullname" .) .Values.litellm.service.port | quote }}
  ENABLE_VLLM: "vllm"
  VLLM_URL: {{ printf "http://%s-litellm:%v/v1" (include "rhdh-agent-sandbox.fullname" .) .Values.litellm.service.port | quote }}
  VLLM_API_KEY: {{ $litellm | quote }}
  VLLM_TLS_VERIFY: "false"
{{- end }}
