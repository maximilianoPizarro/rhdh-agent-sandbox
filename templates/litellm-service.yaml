{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
    app.kubernetes.io/part-of: {{ include "rhdh-agent-sandbox.fullname" . }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.litellm.service.port }}
      targetPort: http
      name: http
  selector:
    app: {{ include "rhdh-agent-sandbox.fullname" . }}-litellm
{{- end }}
