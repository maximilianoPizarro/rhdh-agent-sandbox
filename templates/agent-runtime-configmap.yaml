{{- if .Values.agents.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-agent-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
data:
  server.py: |
    import json, os, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PORT = int(os.environ.get("PORT", "8080"))
    BASE = os.environ.get("LITELLM_API_BASE", "").rstrip("/")
    KEY = os.environ.get("LITELLM_API_KEY", "")
    MODEL = os.environ.get("MODEL", "granite")
    SPEC = os.environ.get("AGENT_SPEC", "")
    FRAMEWORK = os.environ.get("FRAMEWORK", "")
    LANGUAGE = os.environ.get("LANGUAGE", "")

    class Handler(BaseHTTPRequestHandler):
        def _json(self, code, obj):
            body = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path in ("/health", "/healthz"):
                return self._json(200, {"status": "ok", "framework": FRAMEWORK, "language": LANGUAGE})
            if self.path == "/":
                return self._json(200, {
                    "service": "rhdh-agent-sandbox-agent",
                    "framework": FRAMEWORK,
                    "language": LANGUAGE,
                    "model": MODEL,
                    "agentSpec": SPEC,
                })
            self._json(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/v1/chat":
                return self._json(404, {"error": "not found"})
            length = int(self.headers.get("Content-Length", "0"))
            raw = self.rfile.read(length) if length else b"{}"
            try:
                payload = json.loads(raw.decode() or "{}")
            except Exception:
                return self._json(400, {"error": "invalid json"})
            user = payload.get("message") or payload.get("prompt") or ""
            messages = [
                {"role": "system", "content": f"Framework={FRAMEWORK}. {SPEC}"},
                {"role": "user", "content": user},
            ]
            req = urllib.request.Request(
                f"{BASE}/chat/completions",
                data=json.dumps({"model": MODEL, "messages": messages}).encode(),
                headers={
                    "Content-Type": "application/json",
                    "Authorization": f"Bearer {KEY}",
                },
                method="POST",
            )
            try:
                with urllib.request.urlopen(req, timeout=120) as resp:
                    data = json.loads(resp.read().decode())
                content = data["choices"][0]["message"]["content"]
                return self._json(200, {"reply": content, "model": MODEL, "framework": FRAMEWORK})
            except Exception as exc:
                return self._json(502, {"error": str(exc)})

        def log_message(self, fmt, *args):
            print(fmt % args, flush=True)

    print(f"agent started on :{PORT} framework={FRAMEWORK} language={LANGUAGE} model={MODEL}", flush=True)
    HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
{{- end }}
