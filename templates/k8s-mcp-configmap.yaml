{{- if and .Values.mcp.enabled .Values.mcp.kubernetes.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rhdh-agent-sandbox.fullname" . }}-k8s-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhdh-agent-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-mcp
data:
  config.toml: |
    log_level = 3
    port = {{ .Values.mcp.kubernetes.service.port | quote }}
    read_only = false
    disable_destructive = false
    # Sandbox SA is namespace-scoped — hide cluster-wide tools that always 403.
    toolsets = ["core", "config", "openshift", "helm"]
    disabled_tools = [
      "pods_list",
      "namespaces_list",
      "nodes_log",
      "nodes_stats_summary",
      "nodes_top"
    ]

    denied_resources = [
      {group = "rbac.authorization.k8s.io", version = "v1"}
    ]

    [tool_overrides.pods_list_in_namespace]
    description = "List pods in a namespace (required). On Developer Sandbox use the chart namespace; cluster-wide pods_list is disabled."
  repositories.yaml: |
    apiVersion: ""
    generated: "0001-01-01T00:00:00Z"
    repositories:
      - caFile: ""
        certFile: ""
        insecure_skip_tls_verify: false
        keyFile: ""
        name: openshift-helm-charts
        password: ""
        url: https://charts.openshift.io/
        username: ""
{{- end }}
