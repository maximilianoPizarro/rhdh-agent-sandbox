<div class="pf-v6-c-masthead" id="masthead">
  <div class="pf-v6-c-masthead__main">
    <div class="pf-v6-c-masthead__brand">
      <a href="{{ '/' | relative_url }}" class="masthead-logo" aria-label="Home">
        <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="36" height="36" class="site-logo" />
        <span class="masthead-title">rhdh-agent-sandbox</span>
      </a>
    </div>
    <div class="pf-v6-c-masthead__content">
      <nav class="masthead-nav" aria-label="Main navigation">
        {% for item in site.data.nav %}
        {% if item.url %}
        <a href="{{ item.url | relative_url }}" class="masthead-nav-link{% if page.url == item.url %} pf-m-current{% endif %}">{{ item.title }}</a>
        {% endif %}
        {% endfor %}
      </nav>
      <a href="https://github.com/{{ site.repository }}" class="masthead-github" aria-label="GitHub repository" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <button class="masthead-toggle" id="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M1 2.75A.75.75 0 011.75 2h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 2.75zm0 5A.75.75 0 011.75 7h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 7.75zm0 5a.75.75 0 011.75-.75h12.5a.75.75 0 010 1.5H1.75a.75.75 0 01-.75-.75z"/>

    </div>
  </div>
</div>
