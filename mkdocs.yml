site_name: rhdh-agent-sandbox
site_description: Agent-friendly Red Hat Developer Hub on OpenShift Developer Sandbox
site_url: https://maximilianopizarro.github.io/rhdh-agent-sandbox/
repo_url: https://github.com/maximilianopizarro/rhdh-agent-sandbox
repo_name: maximilianopizarro/rhdh-agent-sandbox
edit_uri: edit/main/docs/
docs_dir: docs-src
site_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/css/journey-carousel.css
extra_javascript:
  - assets/js/journey-carousel.js

plugins:
  - search

nav:
  - Home: index.md
  - Journey: journey.md
  - Get started:
      - Quickstart: quickstart.md
      - Golden Paths: golden-paths.md
      - Agents: agents.md
      - Verify the install: verify.md
      - Demo script: demo-script.md
  - How it works:
      - Architecture: architecture.md
      - Lightspeed & models: lightspeed-models.md
      - AI capabilities: ai-capabilities.md
  - Workspaces:
      - DevSpaces AI: devspaces-ai.md
      - Cursor (optional): devspaces-cursor.md
      - OpenClaw (optional): openclaw.md
  - Operations:
      - Troubleshooting: troubleshooting.md
      - Community packs / Quay: community-plugins-quay.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
