# Profile for OpenShift Developer Sandbox
# Usage:
#   export MODEL_API_KEY=$(oc whoami -t)
#   helm upgrade --install rhdh-agent . -n $(oc project -q) \
#     -f values-sandbox.yaml \
#     --set secrets.modelApiKey=$MODEL_API_KEY \
#     --set rhdh.global.clusterRouterBase=apps.rm2.thpm.p1.openshiftapps.com

secrets:
  create: true
  modelApiKey: ""  # override at install: --set secrets.modelApiKey=$(oc whoami -t)

litellm:
  enabled: true
  route:
    enabled: true
  postgres:
    enabled: false
  models:
    - name: granite
      modelId: isvc-granite-31-8b-fp8
      apiBase: https://isvc-granite-31-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1
    - name: qwen3
      modelId: isvc-qwen3-8b-fp8
      apiBase: https://isvc-qwen3-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1
  defaultModel: granite

mcp:
  enabled: true
  quarkus:
    enabled: true
    route:
      enabled: false
  kubernetes:
    enabled: true
    route:
      enabled: false
  inspector:
    enabled: false
  serviceAccount:
    create: true
    name: rhdh-agent-mcp

communityPlugins:
  enabled: true
  registry: ghcr.io
  repositoryPrefix: maximilianoPizarro/rhdh-agent-sandbox
  tag: "0.1.0"

rhdh:
  enabled: true
  global:
    # REQUIRED: your sandbox apps domain, e.g. apps.rm2.thpm.p1.openshiftapps.com
    clusterRouterBase: apps.rm2.thpm.p1.openshiftapps.com
    lightspeed:
      enabled: true
      secret:
        create: false
        name: rhdh-agent-sandbox-secrets
    dynamic:
      includes:
        - dynamic-plugins.default.yaml
      plugins:
        # Kubernetes / Topology (namespace-scoped experience)
        - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
          disabled: false
        # TechDocs
        - package: ./dynamic-plugins/dist/backstage-plugin-techdocs
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
          disabled: false
        # GitHub
        - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
          disabled: false
        # Note: demo AI Skills/Prompts ship as catalog entities (ConfigMap) + GHCR asset packs.
        # Official community plugins are discovered via catalogIndex.extraImages below.
    catalogIndex:
      extraImages:
        - name: community
          registry: ghcr.io
          repository: redhat-developer/rhdh-plugin-community-index
          tag: "1.10"
        - name: ai-demo
          registry: ghcr.io
          repository: maximilianoPizarro/rhdh-agent-sandbox/plugin-catalog-index
          tag: "0.1.0"
  upstream:
    backstage:
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi
      appConfig:
        app:
          title: Agent-friendly Developer Hub
        auth:
          environment: development
        catalog:
          locations:
            - type: file
              target: /opt/app-root/src/catalog/all.yaml
              rules:
                - allow: [Component, System, API, Resource, Location, Template, User, Group]
        backend:
          actions:
            pluginSources:
              - software-catalog-mcp-tool
              - techdocs-mcp-tool
          reading:
            allow:
              - host: github.com
              - host: raw.githubusercontent.com
              - host: "*.github.io"
        kubernetes:
          serviceLocatorMethod:
            type: multiTenant
          clusterLocatorMethods:
            - type: config
              clusters:
                - url: https://kubernetes.default.svc
                  name: sandbox
                  authProvider: serviceAccount
                  skipTLSVerify: true
                  serviceAccountToken:
                    $file: /var/run/secrets/kubernetes.io/serviceaccount/token
        # Lightspeed LLM via LiteLLM (OpenAI-compatible)
        # Wired at runtime through lightspeed secret / stack; also exposed for MCP clients
        mcp:
          mcpServers:
            rhdh-actions:
              url: http://localhost:7007/api/mcp-actions/v1
            openshift-mcp:
              url: http://rhdh-agent-sandbox-mcp:8080/mcp
            k8s-mcp:
              url: http://rhdh-agent-sandbox-k8s-mcp:8085/mcp
      extraEnvVars:
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
    postgresql:
      primary:
        persistence:
          size: 1Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
