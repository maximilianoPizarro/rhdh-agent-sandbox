name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm dependency + lint
        run: |
          helm dependency update
          helm lint .
          helm template rhdh-agent . \
            --set secrets.modelApiKey=dummy \
            --set rhdh.global.clusterRouterBase=apps.example.openshiftapps.com \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

  quay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
      - name: Login to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [[ -z "${QUAY_USERNAME}" || -z "${QUAY_PASSWORD}" ]]; then
            echo "ERROR: QUAY_USERNAME and QUAY_PASSWORD secrets are required" >&2
            exit 1
          fi
          printf '%s' "${QUAY_PASSWORD}" | podman login quay.io -u "${QUAY_USERNAME}" --password-stdin
      - name: Build and push asset packs
        env:
          ENGINE: podman
          REGISTRY: quay.io
          REPO: maximilianopizarro/rhdh-agent-sandbox
        run: |
          chmod +x community-plugins/build-and-push.sh
          ./community-plugins/build-and-push.sh "${{ github.ref_name == 'main' && '0.1.0' || github.sha }}"

  # GitHub Pages via Actions deployment (Settings → Pages → Source: GitHub Actions).
  # MkDocs builds HTML from docs/; Helm repo artifacts (index.yaml, .tgz) are
  # copied into the built site so the same URL serves docs + chart repo.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [helm]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build MkDocs site
        run: |
          pip install 'mkdocs-material==9.7.7'
          mkdocs build --strict
      - name: Package Helm chart into site for Pages
        run: |
          helm dependency update
          helm package . -d site
          helm repo index site --url https://maximilianopizarro.github.io/rhdh-agent-sandbox
          # Copy Artifact Hub metadata
          cp docs/artifacthub-repo.yml site/artifacthub-repo.yml
          ls -lh site/rhdh-agent-sandbox-*.tgz site/index.yaml site/artifacthub-repo.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
