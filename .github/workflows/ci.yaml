name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm dependency + lint
        run: |
          helm dependency update
          helm lint . -f values-sandbox.yaml
          helm template rhdh-agent . -f values-sandbox.yaml \
            --set secrets.modelApiKey=dummy \
            --set rhdh.global.clusterRouterBase=apps.example.openshiftapps.com \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

  ghcr:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push asset packs
        env:
          ENGINE: docker
          REGISTRY: ghcr.io
          PREFIX: ${{ github.repository }}
        run: |
          chmod +x community-plugins/build-and-push.sh
          # PREFIX is org/repo — images at ghcr.io/org/repo/<pack>
          export PREFIX="${GITHUB_REPOSITORY,,}"
          ./community-plugins/build-and-push.sh "${{ github.ref_name == 'main' && '0.1.0' || github.sha }}"

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [helm]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs
        run: |
          pip install mkdocs-material
          mkdocs build --strict
      - name: Package Helm chart for Artifact Hub / Pages
        run: |
          helm dependency update
          mkdir -p site/charts
          helm package . -d site/charts
          helm repo index site/charts --url https://maximilianoPizarro.github.io/rhdh-agent-sandbox/charts
          cp artifacthub-repo.yml site/charts/artifacthub-repo.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
