name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm dependency + lint
        run: |
          helm dependency update
          helm lint .
          helm template rhdh-agent . \
            --set secrets.modelApiKey=dummy \
            --set rhdh.global.clusterRouterBase=apps.example.openshiftapps.com \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

  quay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
      - name: Login to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [[ -z "${QUAY_USERNAME}" || -z "${QUAY_PASSWORD}" ]]; then
            echo "ERROR: QUAY_USERNAME and QUAY_PASSWORD secrets are required" >&2
            exit 1
          fi
          printf '%s' "${QUAY_PASSWORD}" | podman login quay.io -u "${QUAY_USERNAME}" --password-stdin
      - name: Build and push asset packs
        env:
          ENGINE: podman
          REGISTRY: quay.io
          REPO: maximilianopizarro/rhdh-agent-sandbox
        run: |
          chmod +x community-plugins/build-and-push.sh
          ./community-plugins/build-and-push.sh "${{ github.ref_name == 'main' && '0.1.0' || github.sha }}"

  # GitHub Pages is configured to serve from /docs on the branch.
  # Keep helm repo index + packaged .tgz + artifacthub-repo.yml there.
  package-docs:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [helm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Package chart into docs/ for Pages + Artifact Hub
        run: |
          set -euo pipefail
          helm dependency update
          rm -f docs/rhdh-agent-sandbox-*.tgz
          helm package . -d docs
          helm repo index docs --url https://maximilianopizarro.github.io/rhdh-agent-sandbox
          test -f docs/artifacthub-repo.yml
          test -f docs/index.yaml
          ls -lh docs/rhdh-agent-sandbox-*.tgz docs/index.yaml docs/artifacthub-repo.yml
      - name: Commit packaged chart to docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.yaml docs/artifacthub-repo.yml docs/rhdh-agent-sandbox-*.tgz
          if git diff --staged --quiet; then
            echo "No chart package changes"
          else
            git commit -m "chore(docs): refresh packaged Helm chart and index.yaml"
            git push
          fi
