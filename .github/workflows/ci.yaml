name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm dependency + lint
        run: |
          chmod +x scripts/sync-skills-to-techdocs.sh
          ./scripts/sync-skills-to-techdocs.sh
          helm dependency update
          helm lint .
          helm template rhdh-agent . \
            --set secrets.modelApiKey=dummy \
            --set rhdh.global.clusterRouterBase=apps.example.openshiftapps.com \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

  quay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
      - name: Login to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [[ -z "${QUAY_USERNAME}" || -z "${QUAY_PASSWORD}" ]]; then
            echo "ERROR: QUAY_USERNAME and QUAY_PASSWORD secrets are required" >&2
            exit 1
          fi
          printf '%s' "${QUAY_PASSWORD}" | podman login quay.io -u "${QUAY_USERNAME}" --password-stdin
      - name: Build and push asset packs
        env:
          ENGINE: podman
          REGISTRY: quay.io
          REPO: maximilianopizarro/rhdh-agent-sandbox
        run: |
          chmod +x community-plugins/build-and-push.sh
          ./community-plugins/build-and-push.sh "${{ github.ref_name == 'main' && '0.1.0' || github.sha }}"

  # GitHub Pages: Settings → Pages → Source: Deploy from branch, Branch: main, Folder: /docs
  # CI builds Jekyll into docs/, adds Helm repo artifacts, and commits.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [helm]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Sync TechDocs platform → docs-src
        run: |
          chmod +x scripts/sync-techdocs-to-pages.sh
          ./scripts/sync-techdocs-to-pages.sh
      - name: Build Jekyll into docs/
        run: |
          gem install jekyll jekyll-seo-tag webrick
          # Save helm artifacts before Jekyll cleans docs/
          mkdir -p /tmp/helm-keep
          cp -f docs/index.yaml docs/artifacthub-repo.yml docs/rhdh-agent-sandbox-*.tgz /tmp/helm-keep/ 2>/dev/null || true
          cd docs-src
          JEKYLL_ENV=production jekyll build --destination ../docs
          cd ..
          # Restore helm artifacts + add .nojekyll
          cp /tmp/helm-keep/* docs/ 2>/dev/null || true
          touch docs/.nojekyll
      - name: Package Helm chart into docs/
        run: |
          helm dependency update
          rm -f docs/rhdh-agent-sandbox-*.tgz
          helm package . -d docs
          helm repo index docs --url https://maximilianopizarro.github.io/rhdh-agent-sandbox
          ls -lh docs/index.yaml docs/artifacthub-repo.yml docs/rhdh-agent-sandbox-*.tgz
      - name: Commit built site to docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No docs changes"
          else
            git commit -m "chore(pages): rebuild site and refresh Helm chart package"
            # Avoid races when multiple pushes land on main (previous failure: non-FF push).
            git pull --rebase origin main
            git push
          fi
