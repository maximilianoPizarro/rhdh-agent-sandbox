apiVersion: v2
name: rhdh-agent-sandbox
description: Agent-friendly Red Hat Developer Hub on OpenShift Developer Sandbox with Intelligent Assistant, LiteLLM, MCP tools, CPU InferenceService, and DevSpaces AI workflows
type: application
version: 0.2.0
appVersion: "2.1.0"
kubeVersion: ">=1.25.0-0"
icon: https://raw.githubusercontent.com/maximilianopizarro/rhdh-agent-sandbox/main/docs/assets/icon.png
home: https://maximilianopizarro.github.io/rhdh-agent-sandbox
keywords:
  - openshift
  - developer-hub
  - backstage
  - intelligent-assistant
  - lightspeed
  - mcp
  - litellm
  - kserve
  - openshift-ai
  - devspaces
  - ai
maintainers:
  - name: maximilianoPizarro
    email: maximiliano.pizarro.5@gmail.com
    url: https://github.com/maximilianopizarro
sources:
  - https://github.com/maximilianopizarro/rhdh-agent-sandbox
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: Upgrade to Red Hat Developer Hub 2.1 (Intelligent Assistant) and Helm values remap
    - kind: added
      description: Chart-managed CPU InferenceService (local-cpu) wired to LiteLLM and Intelligent Assistant
    - kind: added
      description: Hub branding parameters (title, logo, theme colors) and Scorecard plugins
    - kind: fixed
      description: Kubernetes MCP uses public openshift-mcp-server image (or can be disabled)
  artifacthub.io/links: |
    - name: Documentation
      url: https://maximilianopizarro.github.io/rhdh-agent-sandbox
    - name: Source
      url: https://github.com/maximilianopizarro/rhdh-agent-sandbox
  artifacthub.io/maintainers: |
    - name: maximilianoPizarro
      email: maximiliano.pizarro.5@gmail.com
  artifacthub.io/images: |
    - name: litellm
      image: litellm/litellm-non_root:v1.82.3-stable
    - name: openshift-mcp-server
      image: quay.io/maximilianopizarro/openshift-mcp-server:latest
    - name: llama-cpp-server
      image: ghcr.io/ggml-org/llama.cpp:server
dependencies:
  - name: redhat-developer-hub
    version: 2.1.0
    repository: https://charts.openshift.io/
    alias: rhdh
    condition: rhdh.enabled
