# Reference app-config for the sandbox demo (authoritative runtime config is
# values.yaml → rhdh.upstream.backstage.appConfig).
app:
  title: Agent-friendly Developer Hub

auth:
  environment: development
  providers:
    guest:
      userEntityRef: user:default/guest
      dangerouslyAllowOutsideDevelopment: true

permission:
  enabled: false

backend:
  actions:
    pluginSources:
      - software-catalog-mcp-tool
      - techdocs-mcp-tool
  reading:
    allow:
      - host: github.com
      - host: raw.githubusercontent.com
      - host: "*.github.io"

catalog:
  rules:
    - allow:
        - Component
        - System
        - API
        - Resource
        - Location
        - Template
        - User
        - Group
  locations:
    - type: file
      target: /opt/app-root/src/catalog/all.yaml
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernetes.default.svc
          name: sandbox
          authProvider: serviceAccount
          skipTLSVerify: true

lightspeed:
  systemPrompt: >-
    You are the agent-friendly Developer Hub demo assistant on OpenShift Developer Sandbox.
    Prefer catalog, TechDocs, and namespace-scoped MCP tools.
  servers:
    - id: vllm/granite
      url: http://rhdh-agent-sandbox-litellm:4000/v1
      model: granite
    - id: vllm/qwen3
      url: http://rhdh-agent-sandbox-litellm:4000/v1
      model: qwen3

mcp:
  mcpServers:
    rhdh-actions:
      url: http://localhost:7007/api/mcp-actions/v1
    openshift-mcp:
      url: http://rhdh-agent-sandbox-mcp:8080/mcp
    k8s-mcp:
      url: http://rhdh-agent-sandbox-k8s-mcp:8085/mcp
