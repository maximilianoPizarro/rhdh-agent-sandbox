# Custom Lightspeed Core stack for the Sandbox demo.
# Mounted via ConfigMap; see values.yaml rhdh.global.lightspeed.configMaps.
name: lightspeed-core-stack
service:
  host: ${env.SERVICE_HOST:=127.0.0.1}
  port: 8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  use_as_library_client: true
  library_client_config_path: /app-root/config.yaml
user_data_collection:
  feedback_enabled: true
  feedback_storage: '/tmp/data/feedback'
authentication:
  module: 'noop'
conversation_cache:
  type: 'sqlite'
  sqlite:
    db_path: '/tmp/cache.db'
customization:
  profile_path: '/app-root/rhdh-profile.py'
mcp_servers:
  # Built-in RHDH MCP actions (catalog / TechDocs). Token via lightspeed.mcpServers.
  - name: mcp-integration-tools
    provider_id: 'model-context-protocol'
    url: 'http://localhost:7007/api/mcp-actions/v1'
    authorization_headers:
      Authorization: 'client'
  # In-cluster MCP (no auth for Sandbox guest demo).
  - name: openshift-mcp
    provider_id: 'model-context-protocol'
    url: 'http://rhdh-agent-sandbox-mcp:8080/mcp'
  - name: k8s-mcp
    provider_id: 'model-context-protocol'
    url: 'http://rhdh-agent-sandbox-k8s-mcp:8085/mcp'
