apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: openshift-mcp-server
  title: OpenShift MCP Server
  description: Namespace-scoped OpenShift operations for Lightspeed and AI agents
  tags:
    - mcp
    - openshift
    - ai
  annotations:
    backstage.io/source-location: url:https://github.com/maximilianoPizarro/openshift-mcp-server
spec:
  type: mcp-server
  lifecycle: experimental
  owner: group:default/developers
  definition: |
    transport: http
    url: http://rhdh-agent-sandbox-mcp:8080/mcp
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: kubernetes-mcp-server
  title: Kubernetes MCP Server
  description: Official OpenShift/Kubernetes MCP server for CRUD and Helm helpers
  tags:
    - mcp
    - kubernetes
    - ai
spec:
  type: mcp-server
  lifecycle: experimental
  owner: group:default/developers
  definition: |
    transport: http
    url: http://rhdh-agent-sandbox-k8s-mcp:8085/mcp
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: rhdh-mcp-actions
  title: Developer Hub MCP Actions
  description: Catalog and TechDocs actions exposed as MCP tools
  tags:
    - mcp
    - catalog
    - techdocs
spec:
  type: mcp-server
  lifecycle: production
  owner: group:default/developers
  definition: |
    transport: http
    path: /api/mcp-actions/v1
