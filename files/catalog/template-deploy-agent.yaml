apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deploy-agent
  title: Deploy Agent (Golden Path)
  description: >
    Generate a real LangGraph / LangChain.js / LangChain4j agent from your specification,
    then BuildConfig-compile and deploy it in the namespace (no git push required).
  tags:
    - golden-path
    - agent
    - ai
    - mcp
    - langgraph
    - langchain
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Agent identity
      required: [name, owner, language, agentSpec]
      properties:
        name:
          title: Agent name
          description: DNS-1123 name for the Deployment/Service/BuildConfig (e.g. my-triage-agent)
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
        language:
          title: Language / framework
          description: Selects the real agent framework skeleton and build image
          type: string
          default: python
          enum:
            - python
            - nodejs
            - quarkus
          enumNames:
            - "Python → LangGraph (StateGraph + tools)"
            - "Node.js → LangChain.js (createReactAgent)"
            - "Quarkus → LangChain4j (@RegisterAiService)"
        agentType:
          title: Agent type
          description: Selects which tools are enabled in the generated code
          type: string
          default: tool-agent
          enum: [tool-agent, chat-agent, rag-agent]
          enumNames:
            - "tool-agent — k8s + Red Hat CVE/lifecycle tools"
            - "chat-agent — conversation only"
            - "rag-agent — docs search + lifecycle"
        agentSpec:
          title: Agent specification
          description: Natural-language spec injected as the agent system prompt / behaviour
          type: string
          ui:widget: textarea
        model:
          title: LiteLLM model
          type: string
          default: granite
          enum: [granite, qwen3, litemaas-qwen]
  steps:
    - id: map-framework
      name: Resolve framework from language
      action: debug:log
      input:
        message: >-
          language=${{ parameters.language }}
          framework=${{ parameters.language === 'python' and 'langgraph' or parameters.language === 'nodejs' and 'langchain-js' or 'langchain4j' }}
          agentType=${{ parameters.agentType }}
          model=${{ parameters.model }}
    - id: fetch
      name: Generate framework source
      action: fetch:template
      input:
        url: https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/skeletons/deploy-agent/${{ parameters.language }}
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          agentType: ${{ parameters.agentType }}
          agentSpec: ${{ parameters.agentSpec }}
          model: ${{ parameters.model }}
          framework: "${{ parameters.language === 'python' and 'langgraph' or parameters.language === 'nodejs' and 'langchain-js' or 'langchain4j' }}"
    - id: register
      name: Register Component (catalog:register-entity)
      action: fetch:template
      input:
        url: https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/scaffolder/pending-catalog-entity
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          agentType: ${{ parameters.agentType }}
          agentSpec: ${{ parameters.agentSpec }}
          model: ${{ parameters.model }}
          description: ${{ parameters.agentSpec }}
          framework: "${{ parameters.language === 'python' and 'langgraph' or parameters.language === 'nodejs' and 'langchain-js' or 'langchain4j' }}"
    - id: apply-register
      name: Apply catalog registration to cluster
      action: catalog:apply-pending-configmap
      input:
        manifestPath: kubernetes/configmap.yaml
    - id: verify
      name: Verify entity in catalog
      action: catalog:wait-for-entity
      input:
        name: ${{ parameters.name }}
        kind: Component
        namespace: default
        timeoutSeconds: 300
        pollIntervalSeconds: 5
  output:
    links:
      - title: Open Component
        icon: catalog
        entityRef: "component:default/${{ parameters.name }}"
    text:
      - title: Agent scaffolding complete
        content: |
          Framework source generated for **${{ parameters.language }}**.
          Model: ${{ parameters.model }}
          Type: ${{ parameters.agentType }}

          Watch the build and rollout:
            oc get bc/${{ parameters.name }}
            oc logs -f bc/${{ parameters.name }}
            oc get is/${{ parameters.name }}
            oc get deploy/${{ parameters.name }}
            oc logs deploy/${{ parameters.name }}

          Open the Component page for Topology and Dependencies tabs.
