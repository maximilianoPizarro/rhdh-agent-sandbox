apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agent-friendly-devspaces-workspace
  title: Agent-friendly DevSpaces AI Workspace
  description: Scaffold a repository with Devfile, Continue→LiteLLM config, and skills for Developer Sandbox (browser IDE)
  tags:
    - devspaces
    - continue
    - ai
    - recommended
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Service
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          default: Agent-friendly DevSpaces AI workspace
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        stack:
          title: Stack
          type: string
          default: nodejs
          enum:
            - nodejs
            - quarkus
            - python
  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/skeletons/${{ parameters.stack }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          stack: ${{ parameters.stack }}
    - id: publish
      name: Publish instructions
      action: debug:log
      input:
        message: |
          Workspace files prepared for ${{ parameters.name }}.
          Next: push to Git (or import into DevSpaces), open from devfile.yaml,
          wire Continue to the LiteLLM Route (see README). Guest Hub is for Lightspeed/MCP.
  output:
    text:
      - title: Next steps
        content: |
          1. Commit/push the generated workspace (or download and import).
          2. In OpenShift DevSpaces, create a workspace from `devfile.yaml`.
          3. Set LITELLM_API_BASE / LITELLM_API_KEY and run `wire-continue`.
          4. Skills are under `.continue/skills/`; prompts under `docs/prompts/`.
          5. Use Developer Hub **Guest** login for Lightspeed + MCP triage.
