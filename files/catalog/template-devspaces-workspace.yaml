apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agent-friendly-devspaces-workspace
  title: Agent-friendly DevSpaces AI Workspace
  description: >
    Create a ready-to-use OpenShift DevSpaces workspace from a language Devfile
    with Continue preconfigured for LiteLLM. Choose the agent language
    (Python/LangGraph, Node.js/LangChain.js, or Quarkus/LangChain4j) you will develop against.
  tags:
    - golden-path
    - devspaces
    - continue
    - ai
    - recommended
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Workspace
      required: [name, owner, language]
      properties:
        name:
          title: Workspace name
          description: DNS-1123 name for the DevWorkspace (e.g. my-python-agent-ide)
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
        language:
          title: Agent language
          description: Language/framework skeleton opened in the DevSpaces workspace
          type: string
          default: python
          enum:
            - python
            - nodejs
            - quarkus
          enumNames:
            - "Python → LangGraph"
            - "Node.js → LangChain.js"
            - "Quarkus → LangChain4j"
        model:
          title: Default Continue model
          description: Prefill Continue with this LiteLLM alias
          type: string
          default: granite
          enum: [granite, qwen3, litemaas-qwen]
        description:
          title: Description
          type: string
          default: Agent DevSpaces workspace with Continue → LiteLLM
  steps:
    - id: resolve
      name: Resolve stack from language
      action: debug:log
      input:
        message: >-
          Creating DevSpaces workspace ${{ parameters.name }}
          language=${{ parameters.language }}
          framework=${{ parameters.language === 'python' and 'langgraph' or parameters.language === 'nodejs' and 'langchain-js' or 'langchain4j' }}
          model=${{ parameters.model }}
    - id: register
      name: Register Component (catalog:register-entity)
      action: fetch:template
      input:
        url: https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/scaffolder/pending-catalog-entity-devspaces
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          model: ${{ parameters.model }}
          description: ${{ parameters.description }}
          framework: "${{ parameters.language === 'python' and 'langgraph' or parameters.language === 'nodejs' and 'langchain-js' or 'langchain4j' }}"
    - id: apply-register
      name: Apply catalog registration to cluster
      action: catalog:apply-pending-configmap
      input:
        manifestPath: kubernetes/configmap.yaml
    - id: verify
      name: Verify entity in catalog
      action: catalog:wait-for-entity
      input:
        name: ${{ parameters.name }}
        kind: Component
        namespace: default
        timeoutSeconds: 300
        pollIntervalSeconds: 5
  output:
    links:
      - title: Open DevSpaces dashboard
        url: https://workspaces.openshift.com/dashboard/#/workspaces
      - title: Language factory URL
        url: https://workspaces.openshift.com/#https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/skeletons/${{ parameters.language }}
      - title: Open Component
        icon: catalog
        entityRef: "component:default/${{ parameters.name }}"
    text:
      - title: Ready to code
        content: |
          Catalog Component **${{ parameters.name }}** is registered. Within ~1 minute the
          agent-applier creates a **started** DevWorkspace for language **${{ parameters.language }}**
          with Continue → LiteLLM (default model **${{ parameters.model }}**).

          Open the **DevSpaces dashboard**, select **${{ parameters.name }}**, and start coding.
          No git push step. If the workspace is not listed yet, use the language factory URL.
