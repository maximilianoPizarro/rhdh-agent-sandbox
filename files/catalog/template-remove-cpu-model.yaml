apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: remove-cpu-model
  title: Remove CPU model
  description: Remove a managed CPU model Component (and let the applier delete its InferenceService).
  tags:
    - golden-path
    - ai
    - kserve
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Model to remove
      required: [name]
      properties:
        name:
          title: Component name
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
  steps:
    - id: remove
      name: Remove from catalog
      action: catalog:remove-entity
      input:
        kind: Component
        namespace: default
        name: ${{ parameters.name }}
  output:
    text:
      - title: Removed
        content: Component ${{ parameters.name }} removal requested. Applier deletes the InferenceService shortly.
