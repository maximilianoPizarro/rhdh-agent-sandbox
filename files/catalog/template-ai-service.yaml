apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ai-service-with-mcp
  title: AI Service with MCP wiring
  description: >
    Register an AI service Component and deploy a small HTTP service that proves
    OpenShift/Kubernetes MCP wiring (lists pods + monitors deployments via MCP).
  tags:
    - golden-path
    - ai
    - mcp
    - lightspeed
    - recommended
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Service details
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
        model:
          title: Default model via LiteLLM
          type: string
          default: granite
          enum: [granite, qwen3, litemaas-qwen]
        description:
          title: Description
          type: string
          default: AI service wired to namespace OpenShift/Kubernetes MCP
  steps:
    - id: resolve
      name: Plan MCP wiring
      action: debug:log
      input:
        message: >-
          AI service ${{ parameters.name }} will depend on openshift-mcp + k8s-mcp
          and smoke-call pods_list_in_namespace + monitorDeployments (model=${{ parameters.model }}).
    - id: register
      name: Register Component (catalog:register-entity)
      action: fetch:template
      input:
        url: https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/scaffolder/pending-catalog-entity-ai-service
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          model: ${{ parameters.model }}
          description: ${{ parameters.description }}
    - id: apply-register
      name: Apply catalog registration to cluster
      action: catalog:apply-pending-configmap
      input:
        manifestPath: kubernetes/configmap.yaml
    - id: verify
      name: Verify entity in catalog
      action: catalog:wait-for-entity
      input:
        name: ${{ parameters.name }}
        kind: Component
        namespace: default
        timeoutSeconds: 300
        pollIntervalSeconds: 5
  output:
    links:
      - title: Open Component
        icon: catalog
        entityRef: "component:default/${{ parameters.name }}"
    text:
      - title: MCP wiring
        content: |
          **${{ parameters.name }}** is registered. Within ~1 minute the agent-applier deploys:

          - Service `${{ parameters.name }}:8080`
          - `GET /` — service info + LiteLLM model `${{ parameters.model }}`
          - `GET /mcp/smoke` — live calls to **pods_list_in_namespace** (k8s-mcp) and **monitorDeployments** (openshift-mcp)

          Catalog dependsOn: OpenShift MCP, Kubernetes MCP, Hub MCP Actions, Red Hat Security MCP (SSO via Cursor).
