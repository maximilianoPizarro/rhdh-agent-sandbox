apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sample-python-agent
  title: Sample Python agent (LangGraph)
  description: Chart-managed sample agent Pod using LangGraph-oriented stub and LiteLLM
  tags: [agent, golden-path, python, sample]
  annotations:
    rhdh-agent-sandbox.io/managed-agent: "true"
    rhdh-agent-sandbox.io/language: python
    rhdh-agent-sandbox.io/framework: langgraph
    rhdh-agent-sandbox.io/model: granite
    rhdh-agent-sandbox.io/agent-type: tool-agent
    rhdh-agent-sandbox.io/agent-spec: "You are a Python/LangGraph sample agent on Developer Sandbox. Prefer list/get before mutate."
  links:
    - url: https://workspaces.openshift.com/#https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/skeletons/python
      title: Open in DevSpaces
      icon: catalog
spec:
  type: service
  lifecycle: experimental
  owner: group:default/developers
  system: agent-sandbox
