schemaVersion: 2.2.0
metadata:
  name: agent-friendly-workspace
  version: 0.1.0
  displayName: Agent-friendly Developer Workspace
  description: DevSpaces workspace tuned for Cursor Remote SSH and OpenShift MCP workflows
  tags:
    - cursor
    - mcp
    - ai
    - sandbox
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 200m
      mountSources: true
      endpoints:
        - name: http-3000
          targetPort: 3000
          exposure: public
          protocol: http
        - name: http-8080
          targetPort: 8080
          exposure: public
          protocol: http
      env:
        - name: SHELL
          value: /bin/bash
commands:
  - id: install-oc
    exec:
      component: tools
      commandLine: |
        echo "oc CLI available in DevSpaces UDI image"
        oc version || true
  - id: print-cursor-help
    exec:
      component: tools
      commandLine: |
        cat <<'EOF'
        Connect Cursor:
          1) Start this workspace in OpenShift DevSpaces
          2) Use Remote SSH / DevSpaces from Cursor
          3) Install skills from Developer Hub catalog (Resources tagged skill)
        EOF
events:
  postStart:
    - print-cursor-help
