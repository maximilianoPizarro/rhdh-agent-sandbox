schemaVersion: 2.2.0
metadata:
  name: sample-quarkus-agent
  version: 0.1.0
  displayName: Sample Quarkus agent (LangChain4j)
  description: DevSpaces workspace for the chart sample Quarkus / LangChain4j agent
  tags: [agent, quarkus, langchain4j, ai]
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 2Gi
      mountSources: true
commands:
  - id: remind-litellm
    exec:
      component: tools
      commandLine: echo "Point Continue at the LiteLLM Route (litellm-master-key)."
      workingDir: ${PROJECT_SOURCE}
