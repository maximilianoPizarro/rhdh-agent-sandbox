schemaVersion: 2.2.0
metadata:
  name: sample-python-agent
  version: 0.1.0
  displayName: Sample Python agent (LangGraph)
  description: DevSpaces workspace for the chart sample Python / LangGraph agent
  tags: [agent, python, langgraph, ai]
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 2Gi
      mountSources: true
commands:
  - id: remind-litellm
    exec:
      component: tools
      commandLine: echo "Point Continue at the LiteLLM Route (litellm-master-key)."
      workingDir: ${PROJECT_SOURCE}
