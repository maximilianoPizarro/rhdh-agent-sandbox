# Reference LiteLLM config (rendered by templates/litellm-configmap.yaml).
model_list:
  - model_name: local-cpu
    litellm_params:
      model: openai/local-cpu
      api_base: http://local-cpu-predictor.NAMESPACE.svc.cluster.local:80/v1
      api_key: os.environ/LITELLM_MASTER_KEY
      ssl_verify: false
      drop_params: true
      additional_drop_params: ["tool_choice", "tools", "functions", "function_call"]
    model_info:
      supports_function_calling: false
  - model_name: litemaas-qwen
    litellm_params:
      model: openai/Qwen3.6-35B-A3B
      api_base: https://litemaas.rhoai.rh-aiservices-bu.com/v1
      api_key: os.environ/LITEMAAS_API_KEY
      ssl_verify: false
      drop_params: true
    model_info:
      supports_function_calling: true

mcp_servers:
  openshift_mcp_server:
    url: http://rhdh-agent-sandbox-mcp.NAMESPACE.svc.cluster.local:8080/mcp
    transport: http
  kubernetes_mcp_server:
    url: http://rhdh-agent-sandbox-k8s-mcp.NAMESPACE.svc.cluster.local:8085/mcp
    transport: http

litellm_settings:
  drop_params: true
  default_model: "local-cpu"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
