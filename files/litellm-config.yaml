# Reference LiteLLM config (cluster Service DNS is rendered by the Helm template).
model_list:
  - model_name: granite
    litellm_params:
      model: openai/isvc-granite-31-8b-fp8
      api_base: https://isvc-granite-31-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1
      api_key: os.environ/MODEL_API_KEY
      ssl_verify: false
      drop_params: true
      # Sandbox shared models reject tool_choice=auto (no --enable-auto-tool-choice).
      additional_drop_params: ["tool_choice", "tools", "functions", "function_call"]
    model_info:
      supports_function_calling: false
  - model_name: qwen3
    litellm_params:
      model: openai/isvc-qwen3-8b-fp8
      api_base: https://isvc-qwen3-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1
      api_key: os.environ/MODEL_API_KEY
      ssl_verify: false
      drop_params: true
      additional_drop_params: ["tool_choice", "tools", "functions", "function_call"]
    model_info:
      supports_function_calling: false
  - model_name: litemaas-qwen
    litellm_params:
      model: openai/Qwen3.6-35B-A3B
      api_base: https://litemaas.rhoai.rh-aiservices-bu.com/v1
      api_key: os.environ/LITEMAAS_API_KEY
      ssl_verify: false
      drop_params: true
    model_info:
      supports_function_calling: true

mcp_servers:
  openshift_mcp_server:
    url: http://rhdh-agent-sandbox-mcp.NAMESPACE.svc.cluster.local:8080/mcp
    transport: http
  kubernetes_mcp_server:
    url: http://rhdh-agent-sandbox-k8s-mcp.NAMESPACE.svc.cluster.local:8085/mcp
    transport: http

litellm_settings:
  drop_params: true
  default_model: granite

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
