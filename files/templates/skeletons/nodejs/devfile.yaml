schemaVersion: 2.2.0
metadata:
  name: ${{ values.name }}
  version: 0.1.0
  displayName: ${{ values.name }}
components:
  - name: runtime
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 2Gi
      mountSources: true
      endpoints:
        - exposure: public
          path: /
          name: node
          protocol: http
          targetPort: 3000
commands:
  - id: install
    exec:
      component: runtime
      commandLine: npm install || true
  - id: start
    exec:
      component: runtime
      commandLine: npm start || node -e "require('http').createServer((q,s)=>s.end('ok')).listen(3000)"
