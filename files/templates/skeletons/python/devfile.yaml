schemaVersion: 2.2.0
metadata:
  name: agent-friendly-workspace
  version: 0.2.0
  displayName: Agent-friendly DevSpaces AI Workspace
  description: Browser IDE (Che Code) with Continue → LiteLLM on Developer Sandbox
  tags:
    - continue
    - mcp
    - ai
    - sandbox
    - lightspeed
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 200m
      mountSources: true
      endpoints:
        - name: http-3000
          targetPort: 3000
          exposure: public
          protocol: http
        - name: http-8080
          targetPort: 8080
          exposure: public
          protocol: http
      env:
        - name: SHELL
          value: /bin/bash
        # Set these when starting the workspace (or edit .continue/config.json).
        - name: LITELLM_API_BASE
          value: ""
        - name: LITELLM_API_KEY
          value: ""
      # Che Code / VS Code extensions for in-browser AI
      attributes:
        controller.devfile.io/merge-contribution: true
commands:
  - id: print-ai-help
    exec:
      component: tools
      commandLine: |
        cat <<'EOF'
        DevSpaces AI workspace
        ----------------------
        1) Open Continue in Che Code (sidebar).
        2) Env LITELLM_API_* from Secret rhdh-agent-sandbox-continue (chart), or set manually then wire-continue.
             oc get secret rhdh-agent-sandbox-continue -o jsonpath='{.data.LITELLM_API_BASE}' | base64 -d
        3) Models: granite | qwen3
        4) Skills live under .continue/skills/ — prompts under docs/prompts/
        5) Hub Lightspeed + MCP stay in Developer Hub (guest login). This IDE talks to LiteLLM Route only.
        EOF
  - id: wire-continue
    exec:
      component: tools
      commandLine: |
        set -euo pipefail
        CFG=".continue/config.json"
        if [[ -z "${LITELLM_API_BASE:-}" || -z "${LITELLM_API_KEY:-}" ]]; then
          if oc get secret rhdh-agent-sandbox-continue >/dev/null 2>&1; then
            export LITELLM_API_BASE="$(oc get secret rhdh-agent-sandbox-continue -o jsonpath='{.data.LITELLM_API_BASE}' | base64 -d)"
            export LITELLM_API_KEY="$(oc get secret rhdh-agent-sandbox-continue -o jsonpath='{.data.LITELLM_API_KEY}' | base64 -d)"
          fi
        fi
        if [[ -z "${LITELLM_API_BASE:-}" || -z "${LITELLM_API_KEY:-}" ]]; then
          echo "Set LITELLM_API_BASE and LITELLM_API_KEY (or mount rhdh-agent-sandbox-continue), then re-run wire-continue."
          exit 0
        fi
        mkdir -p .continue
        cat > "${CFG}" <<EOF
        {
          "models": [
            {
              "title": "Granite (LiteLLM)",
              "provider": "openai",
              "model": "granite",
              "apiBase": "${LITELLM_API_BASE}",
              "apiKey": "${LITELLM_API_KEY}"
            },
            {
              "title": "Qwen3 (LiteLLM)",
              "provider": "openai",
              "model": "qwen3",
              "apiBase": "${LITELLM_API_BASE}",
              "apiKey": "${LITELLM_API_KEY}"
            }
          ],
          "tabAutocompleteModel": {
            "title": "Granite autocomplete",
            "provider": "openai",
            "model": "granite",
            "apiBase": "${LITELLM_API_BASE}",
            "apiKey": "${LITELLM_API_KEY}"
          }
        }
        EOF
        echo "Wrote ${CFG}"
events:
  postStart:
    - print-ai-help
    - wire-continue
