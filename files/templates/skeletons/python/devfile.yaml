schemaVersion: 2.2.0
metadata:
  name: agent-friendly-workspace
  version: 0.4.0
  displayName: Agent-friendly DevSpaces AI Workspace
  description: Browser IDE (Che Code) with Continue preinstalled → LiteLLM; language skeleton selected via AGENT_LANGUAGE
  tags:
    - continue
    - mcp
    - ai
    - sandbox
    - lightspeed
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 200m
      mountSources: true
      endpoints:
        - name: http-3000
          targetPort: 3000
          exposure: public
          protocol: http
        - name: http-8080
          targetPort: 8080
          exposure: public
          protocol: http
      env:
        - name: SHELL
          value: /bin/bash
        - name: DEFAULT_EXTENSIONS
          value: /tmp/continue.vsix
        - name: AGENT_LANGUAGE
          value: python
        - name: CONTINUE_DEFAULT_MODEL
          value: granite
        - name: LITELLM_API_BASE
          value: ""
        - name: LITELLM_API_KEY
          value: ""
      attributes:
        controller.devfile.io/merge-contribution: true
commands:
  - id: download-continue-extension
    exec:
      component: tools
      commandLine: |
        set -euo pipefail
        OUT=/tmp/continue.vsix
        if [[ -s "${OUT}" ]]; then
          echo "Continue vsix already present: ${OUT}"
          exit 0
        fi
        META_URL="https://open-vsx.org/api/Continue/continue/linux-x64/latest"
        echo "Resolving Continue linux-x64 from OpenVSX..."
        URL="$(curl -fsSL "${META_URL}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["files"]["download"])')"
        echo "Downloading ${URL}"
        curl -fsSL --retry 3 --retry-delay 2 -o "${OUT}.partial" "${URL}"
        mv "${OUT}.partial" "${OUT}"
        echo "Wrote ${OUT} ($(wc -c < "${OUT}") bytes)"
  - id: ensure-continue-extension
    exec:
      component: tools
      commandLine: |
        set -euo pipefail
        OUT=/tmp/continue.vsix
        SOCK=""
        for _ in $(seq 1 45); do
          SOCK="$(ls /tmp/vscode-ipc-*.sock 2>/dev/null | head -1 || true)"
          [[ -n "${SOCK}" ]] && break
          sleep 2
        done
        if [[ -z "${SOCK}" || ! -s "${OUT}" ]]; then
          echo "Skip CLI install (ipc=${SOCK:-none} vsix=$([ -s "${OUT}" ] && echo yes || echo no))"
          exit 0
        fi
        export VSCODE_IPC_HOOK_CLI="${SOCK}"
        CODE="$(command -v code-oss || true)"
        if [[ -z "${CODE}" ]]; then
          CODE="/checode/checode-linux-libc/ubi9/bin/remote-cli/code-oss"
        fi
        if [[ ! -x "${CODE}" ]]; then
          echo "code-oss not found; relying on DEFAULT_EXTENSIONS"
          exit 0
        fi
        if "${CODE}" --list-extensions 2>/dev/null | grep -qi '^continue.continue'; then
          echo "Continue already installed"
          exit 0
        fi
        echo "Installing Continue from ${OUT} via CLI..."
        "${CODE}" --install-extension "${OUT}" || echo "CLI install deferred; DEFAULT_EXTENSIONS should apply"
  - id: print-ai-help
    exec:
      component: tools
      commandLine: |
        cat <<EOF
        DevSpaces AI workspace
        ----------------------
        Language: ${AGENT_LANGUAGE:-python}
        Default model: ${CONTINUE_DEFAULT_MODEL:-granite}
        1) Continue is preinstalled (OpenVSX → DEFAULT_EXTENSIONS).
        2) Env LITELLM_API_* from Secret rhdh-agent-sandbox-continue (chart), or set manually then wire-continue.
        3) Models: granite | qwen3 | litemaas-qwen
        4) Skills live under .continue/skills/ and .cursor/skills/
        EOF
  - id: wire-continue
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        set -euo pipefail
        CFG=".continue/config.json"
        if [[ -z "${LITELLM_API_BASE:-}" || -z "${LITELLM_API_KEY:-}" ]]; then
          if oc get secret rhdh-agent-sandbox-continue >/dev/null 2>&1; then
            export LITELLM_API_BASE="$(oc get secret rhdh-agent-sandbox-continue -o jsonpath='{.data.LITELLM_API_BASE}' | base64 -d)"
            export LITELLM_API_KEY="$(oc get secret rhdh-agent-sandbox-continue -o jsonpath='{.data.LITELLM_API_KEY}' | base64 -d)"
          fi
        fi
        if [[ -z "${LITELLM_API_BASE:-}" || -z "${LITELLM_API_KEY:-}" ]]; then
          echo "Set LITELLM_API_BASE and LITELLM_API_KEY (or mount rhdh-agent-sandbox-continue), then re-run wire-continue."
          exit 0
        fi
        MODEL="${CONTINUE_DEFAULT_MODEL:-granite}"
        LANG_DIR="${AGENT_LANGUAGE:-python}"
        mkdir -p .continue
        SRC="files/templates/skeletons/${LANG_DIR}"
        if [[ -d "${SRC}" ]]; then
          cp -a "${SRC}/." .
        fi
        cat > "${CFG}" <<EOF
        {
          "models": [
            {
              "title": "Granite (LiteLLM)",
              "provider": "openai",
              "model": "granite",
              "apiBase": "${LITELLM_API_BASE}",
              "apiKey": "${LITELLM_API_KEY}"
            },
            {
              "title": "Qwen3 (LiteLLM)",
              "provider": "openai",
              "model": "qwen3",
              "apiBase": "${LITELLM_API_BASE}",
              "apiKey": "${LITELLM_API_KEY}"
            },
            {
              "title": "LiteMaaS Qwen (LiteLLM)",
              "provider": "openai",
              "model": "litemaas-qwen",
              "apiBase": "${LITELLM_API_BASE}",
              "apiKey": "${LITELLM_API_KEY}"
            }
          ],
          "tabAutocompleteModel": {
            "title": "Autocomplete",
            "provider": "openai",
            "model": "${MODEL}",
            "apiBase": "${LITELLM_API_BASE}",
            "apiKey": "${LITELLM_API_KEY}"
          }
        }
        EOF
        echo "Wrote ${CFG} model=${MODEL} language=${LANG_DIR}"
events:
  postStart:
    - download-continue-extension
    - ensure-continue-extension
    - print-ai-help
    - wire-continue
