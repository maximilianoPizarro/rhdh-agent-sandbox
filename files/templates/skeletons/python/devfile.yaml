schemaVersion: 2.2.0
metadata:
  name: agent-friendly-workspace
  version: 0.4.0
  displayName: Agent-friendly DevSpaces AI Workspace
  description: Browser IDE (Che Code) with Continue preinstalled → LiteLLM; language skeleton selected via AGENT_LANGUAGE
  tags:
    - continue
    - mcp
    - ai
    - sandbox
    - lightspeed
components:
  - name: tools
    attributes:
      controller.devfile.io/merge-contribution: true
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 200m
      mountSources: true
      endpoints:
        - name: http-3000
          targetPort: 3000
          exposure: public
          protocol: http
        - name: http-8080
          targetPort: 8080
          exposure: public
          protocol: http
          secure: true
      env:
        - name: SHELL
          value: /bin/bash
        - name: DEFAULT_EXTENSIONS
          value: /tmp/continue.vsix
        - name: AGENT_LANGUAGE
          value: python
        - name: CONTINUE_DEFAULT_MODEL
          value: granite
        - name: LITELLM_API_BASE
          value: ""
        - name: LITELLM_API_KEY
          value: ""
commands:
  - id: download-continue-extension
    exec:
      component: tools
      commandLine: |
        set -euo pipefail
        OUT=/tmp/continue.vsix
        if [[ -s "${OUT}" ]]; then
          echo "Continue vsix already present: ${OUT}"
          exit 0
        fi
        META_URL="https://open-vsx.org/api/Continue/continue/linux-x64/latest"
        echo "Resolving Continue linux-x64 from OpenVSX..."
        URL="$(curl -fsSL "${META_URL}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["files"]["download"])')"
        echo "Downloading ${URL}"
        curl -fsSL --retry 3 --retry-delay 2 -o "${OUT}.partial" "${URL}"
        mv "${OUT}.partial" "${OUT}"
        echo "Wrote ${OUT} ($(wc -c < "${OUT}") bytes)"
  - id: ensure-continue-extension
    exec:
      component: tools
      commandLine: |
        set -euo pipefail
        OUT=/tmp/continue.vsix
        SOCK=""
        for _ in $(seq 1 45); do
          SOCK="$(ls /tmp/vscode-ipc-*.sock 2>/dev/null | head -1 || true)"
          [[ -n "${SOCK}" ]] && break
          sleep 2
        done
        if [[ -z "${SOCK}" || ! -s "${OUT}" ]]; then
          echo "Skip CLI install (ipc=${SOCK:-none} vsix=$([ -s "${OUT}" ] && echo yes || echo no))"
          exit 0
        fi
        export VSCODE_IPC_HOOK_CLI="${SOCK}"
        CODE="$(command -v code-oss || true)"
        if [[ -z "${CODE}" ]]; then
          CODE="/checode/checode-linux-libc/ubi9/bin/remote-cli/code-oss"
        fi
        if [[ ! -x "${CODE}" ]]; then
          echo "code-oss not found; relying on DEFAULT_EXTENSIONS"
          exit 0
        fi
        if "${CODE}" --list-extensions 2>/dev/null | grep -qi '^continue.continue'; then
          echo "Continue already installed"
          exit 0
        fi
        echo "Installing Continue from ${OUT} via CLI..."
        "${CODE}" --install-extension "${OUT}" || echo "CLI install deferred; DEFAULT_EXTENSIONS should apply"
  - id: print-ai-help
    exec:
      component: tools
      commandLine: |
        cat <<EOF
        DevSpaces AI workspace
        ----------------------
        Language: ${AGENT_LANGUAGE:-python}
        Default model: ${CONTINUE_DEFAULT_MODEL:-granite}
        1) Continue is preinstalled. The left CHAT / Agent panel IS Continue 2 — you need it.
        2) postStart runs wire-continue → ~/.continue/config.yaml (models + MCP). Reload the window if the picker is empty.
        3) Models: granite | qwen3 | litemaas-qwen via LiteLLM. Cluster K8s MCP stays in Hub.
        4) MCP: red-hat-security — public http-8080 SSO helper in Simple Browser (not code-redirect) + hub-mcp-actions.
        5) Skills live under .continue/skills/ and .cursor/skills/
        EOF
  - id: wire-continue
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        set -euo pipefail
        SCRIPT=/opt/rhdh-agent-sandbox/wire-continue.py
        for _ in $(seq 1 15); do
          [[ -f "${SCRIPT}" ]] && break
          sleep 2
        done
        if [[ ! -f "${SCRIPT}" ]]; then
          echo "wire-continue.py not mounted; ensure Helm ConfigMap rhdh-agent-sandbox-wire-continue exists."
          exit 0
        fi
        python3 "${SCRIPT}"
  - id: auth-rh-security-mcp
    exec:
      component: tools
      commandLine: |
        set -euo pipefail
        for CAND in \
          "$HOME/.local/share/rhdh-agent-sandbox/wire-continue.py" \
          /opt/rhdh-agent-sandbox/wire-continue.py
        do
          if [[ -f "${CAND}" ]] && grep -q -- '--auth-rh-security' "${CAND}"; then
            exec python3 "${CAND}" --auth-rh-security
          fi
        done
        echo "wire-continue.py --auth-rh-security not found. Run Devfile command wire-continue first."
        exit 1
events:
  postStart:
    - download-continue-extension
    - ensure-continue-extension
    - print-ai-help
    - wire-continue
