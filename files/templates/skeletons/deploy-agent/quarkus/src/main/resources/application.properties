quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=*

# LiteLLM OpenAI-compatible endpoint (overridden by env in Deployment)
quarkus.langchain4j.openai.base-url=${LITELLM_API_BASE:http://rhdh-agent-sandbox-litellm:4000/v1}
quarkus.langchain4j.openai.api-key=${LITELLM_API_KEY:changeme}
quarkus.langchain4j.openai.chat-model.model-name=${MODEL:granite}
quarkus.langchain4j.openai.chat-model.temperature=0.2

agent.name=${AGENT_NAME:agent}
agent.language=quarkus
agent.framework=langchain4j
agent.type=${AGENT_TYPE:tool-agent}
agent.spec=${AGENT_SPEC:You are a helpful namespace-scoped Quarkus agent.}
