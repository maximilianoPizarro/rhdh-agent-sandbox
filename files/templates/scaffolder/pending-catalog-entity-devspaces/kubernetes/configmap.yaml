apiVersion: v1
kind: ConfigMap
metadata:
  name: pending-entity-${{ values.name }}
  labels:
    rhdh-agent-sandbox.io/pending-catalog-entity: "true"
data:
  entity.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ values.name }}
      title: ${{ values.name }}
      description: ${{ values.description }}
      tags:
        - agent
        - golden-path
        - devspaces
        - ${{ values.language }}
      annotations:
        rhdh-agent-sandbox.io/managed-devworkspace: "true"
        rhdh-agent-sandbox.io/language: ${{ values.language }}
        rhdh-agent-sandbox.io/framework: ${{ values.framework }}
        rhdh-agent-sandbox.io/model: ${{ values.model }}
        rhdh-agent-sandbox.io/devspaces-workspace: ${{ values.name }}
        backstage.io/techdocs-ref: dir:/opt/app-root/src/techdocs/platform
      links:
        - url: https://workspaces.openshift.com/dashboard/#/workspaces
          title: Open DevSpaces dashboard
          icon: catalog
    spec:
      type: website
      lifecycle: experimental
      owner: ${{ values.owner }}
      system: agent-sandbox
