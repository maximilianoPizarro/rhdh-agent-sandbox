apiVersion: v1
kind: ConfigMap
metadata:
  name: pending-entity-${{ values.name }}
  labels:
    rhdh-agent-sandbox.io/pending-catalog-entity: "true"
data:
  entity.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: ${{ values.name }}-http
      title: ${{ values.name }} HTTP
      description: >-
        ${{ values.description }}
      tags:
        - ai
        - mcp
        - golden-path
    spec:
      type: openapi
      lifecycle: experimental
      owner: ${{ values.owner }}
      system: agent-sandbox
      definition: |
        openapi: 3.0.0
        info:
          title: ${{ values.name }}
          version: "1.0"
        servers:
          - url: __AGENT_BASE_URL__
            description: OpenShift Route for this service
        paths:
          /:
            get:
              summary: Service info and LiteLLM model
              responses:
                "200":
                  description: Service metadata
          /mcp/smoke:
            get:
              summary: Live MCP smoke test (pods_list_in_namespace + monitorDeployments)
              responses:
                "200":
                  description: MCP smoke results
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ values.name }}
      title: ${{ values.name }}
      description: >-
        ${{ values.description }}
      tags:
        - ai
        - mcp
        - golden-path
      annotations:
        rhdh-agent-sandbox.io/managed-ai-service: "true"
        rhdh-agent-sandbox.io/model: ${{ values.model }}
        backstage.io/kubernetes-label-selector: "app.kubernetes.io/name=${{ values.name }}"
    spec:
      type: service
      lifecycle: experimental
      owner: ${{ values.owner }}
      system: agent-sandbox
      providesApis:
        - api:default/${{ values.name }}-http
      dependsOn:
        - api:default/openshift-mcp-server
        - api:default/kubernetes-mcp-server
        - api:default/rhdh-mcp-actions
        - api:default/red-hat-security-mcp
