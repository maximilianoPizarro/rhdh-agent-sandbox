apiVersion: v1
kind: ConfigMap
metadata:
  name: pending-entity-${{ values.name }}
  labels:
    rhdh-agent-sandbox.io/pending-catalog-entity: "true"
data:
  entity.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ values.name }}
      title: ${{ values.name }}
      description: ${{ values.description }}
      tags:
        - ai
        - mcp
        - golden-path
      annotations:
        rhdh-agent-sandbox.io/managed-ai-service: "true"
        rhdh-agent-sandbox.io/model: ${{ values.model }}
        backstage.io/kubernetes-label-selector: "app.kubernetes.io/name=${{ values.name }}"
    spec:
      type: service
      lifecycle: experimental
      owner: ${{ values.owner }}
      system: agent-sandbox
      dependsOn:
        - api:default/openshift-mcp-server
        - api:default/kubernetes-mcp-server
        - api:default/rhdh-mcp-actions
        - api:default/red-hat-security-mcp
