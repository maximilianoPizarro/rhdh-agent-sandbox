apiVersion: v1
kind: ConfigMap
metadata:
  name: pending-entity-${{ values.name }}
  labels:
    rhdh-agent-sandbox.io/pending-catalog-entity: "true"
data:
  entity.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ values.name }}
      title: ${{ values.name }}
      description: ${{ values.description }}
      tags:
        - agent
        - golden-path
        - ${{ values.language }}
        - build
      annotations:
        rhdh-agent-sandbox.io/managed-agent: "true"
        rhdh-agent-sandbox.io/build: "true"
        rhdh-agent-sandbox.io/language: ${{ values.language }}
        rhdh-agent-sandbox.io/framework: ${{ values.framework }}
        rhdh-agent-sandbox.io/model: ${{ values.model }}
        rhdh-agent-sandbox.io/agent-type: ${{ values.agentType }}
        rhdh-agent-sandbox.io/agent-spec: ${{ values.agentSpec }}
        rhdh-agent-sandbox.io/image-stream: "${{ values.name }}:latest"
        rhdh-agent-sandbox.io/build-source: ${{ values.language }}
        backstage.io/kubernetes-label-selector: "app.kubernetes.io/name=${{ values.name }}"
        backstage.io/techdocs-ref: url:https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/techdocs/platform/golden-paths
      links:
        - url: https://workspaces.openshift.com/#https://github.com/maximilianoPizarro/rhdh-agent-sandbox/tree/main/files/templates/skeletons/deploy-agent/${{ values.language }}
          title: Open skeleton in DevSpaces
          icon: catalog
    spec:
      type: service
      lifecycle: experimental
      owner: ${{ values.owner }}
      system: agent-sandbox
