# Default values for rhdh-agent-sandbox (OpenShift Developer Sandbox only).
#
# Install:
#   export MODEL_API_KEY=$(oc whoami -t)
#   helm upgrade --install rhdh-agent . -n "$(oc project -q)" \
#     --set secrets.modelApiKey="$MODEL_API_KEY" \
#     --set rhdh.global.clusterRouterBase=apps.rm2.thpm.p1.openshiftapps.com

nameOverride: ""
# Keep service DNS short and stable: <fullname>-mcp / <fullname>-litellm
fullnameOverride: "rhdh-agent-sandbox"

# Bootstrap secrets (generated if create=true and keys empty)
secrets:
  create: true
  name: rhdh-agent-sandbox-secrets
  backendSecret: ""
  litellmMasterKey: ""
  mcpToken: ""
  # OpenShift user token for sandbox-shared-models oauth-proxy (~24h TTL)
  modelApiKey: ""  # override: --set secrets.modelApiKey=$(oc whoami -t)

litellm:
  enabled: true
  image:
    repository: litellm/litellm-non_root
    tag: v1.82.3-stable
    pullPolicy: IfNotPresent
  service:
    port: 4000
  route:
    enabled: true
    tls:
      termination: edge
  # LiteLLM image is memory-heavy; 512Mi limit OOMs on Sandbox.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1536Mi
  models:
    - name: granite
      modelId: isvc-granite-31-8b-fp8
      apiBase: https://isvc-granite-31-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1
      apiKeyEnv: MODEL_API_KEY
      supportsFunctionCalling: false
      dropTools: true
    - name: qwen3
      modelId: isvc-qwen3-8b-fp8
      apiBase: https://isvc-qwen3-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1
      apiKeyEnv: MODEL_API_KEY
      supportsFunctionCalling: false
      dropTools: true
    # LiteMaaS private Qwen — tool calling ON (key from Secret litemaas-credentials, not git)
    - name: litemaas-qwen
      modelId: Qwen3.6-35B-A3B
      apiBase: https://litemaas.rhoai.rh-aiservices-bu.com/v1
      apiKeyEnv: LITEMAAS_API_KEY
      supportsFunctionCalling: true
      dropTools: false
  # Prefer shared granite for default chat; tool demos use litemaas-qwen
  defaultModel: granite
  # Optional: Secret holding LiteMaaS bearer key (key name: api-key)
  litemaasSecret:
    name: litemaas-credentials
    key: api-key
  postgres:
    enabled: false

mcp:
  enabled: true
  quarkus:
    enabled: true
    image:
      repository: quay.io/maximilianopizarro/openshift-mcp-server
      tag: latest
      pullPolicy: Always
    service:
      port: 8080
    route:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  kubernetes:
    enabled: true
    image:
      repository: quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/openshift-mcp-server
      tag: latest
      pullPolicy: Always
    service:
      port: 8085
    route:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  inspector:
    enabled: false
  serviceAccount:
    create: true
    name: rhdh-agent-mcp
  rbac:
    create: true

catalog:
  enabled: true
  # Mount AI catalog entities + software templates into a ConfigMap for RHDH locations
  configMapName: rhdh-agent-sandbox-catalog

# Golden Path agent pods (samples + catalog-driven applier)
agents:
  enabled: true
  # Shared sample-agent stub log level (DEBUG|INFO|WARN|ERROR)
  logLevel: INFO
  applier:
    enabled: true
    logLevel: INFO
  # Namespace RBAC for Hub SA (scaffolder kubernetes module + optional apply)
  hubRbac:
    enabled: true
  samples:
    - name: sample-python-agent
      language: python
      framework: langgraph
      model: granite
      agentSpec: "You are a Python/LangGraph sample agent on Developer Sandbox. Prefer list/get before mutate."
    - name: sample-nodejs-agent
      language: nodejs
      framework: langchain-js
      model: granite
      agentSpec: "You are a Node.js/LangChain.js sample agent on Developer Sandbox. Prefer list/get before mutate."
    - name: sample-quarkus-agent
      language: quarkus
      framework: langchain4j
      model: granite
      agentSpec: "You are a Quarkus/LangChain4j sample agent on Developer Sandbox. Prefer list/get before mutate."

communityPlugins:
  # OCI asset packs published by CI to Quay (Podman). Tag = <pack>-<tag>.
  enabled: true
  registry: quay.io
  repository: maximilianopizarro/rhdh-agent-sandbox
  tag: "0.1.0"
  packages:
    - name: ai-skills-pack
      disabled: false
    - name: ai-prompts-pack
      disabled: false

# Subchart: official Red Hat Developer Hub
rhdh:
  enabled: true
  nameOverride: developer-hub
  global:
    # REQUIRED: your sandbox apps domain, e.g. apps.rm2.thpm.p1.openshiftapps.com
    clusterRouterBase: apps.rm2.thpm.p1.openshiftapps.com
    host: ""
    auth:
      backend:
        enabled: true
        existingSecret: rhdh-agent-sandbox-secrets
    lightspeed:
      enabled: true
      secret:
        create: false
        name: rhdh-agent-sandbox-secrets
      # Chart ConfigMap with OpenShift/k8s MCP + RHDH mcp-integration-tools.
      configMaps:
        - name: stack
          create: false
          nameOverride: rhdh-agent-sandbox-lightspeed-stack
          mountPath: /app-root/lightspeed-stack.yaml
          subPath: lightspeed-stack.yaml
          sourceFile: lightspeed-stack.yaml
          optional: false
        - name: config
          create: true
          nameOverride: ""
          mountPath: /app-root/config.yaml
          subPath: config.yaml
          sourceFile: config.yaml
          optional: false
        - name: rhdh-profile
          create: true
          nameOverride: ""
          mountPath: /app-root/rhdh-profile.py
          subPath: rhdh-profile.py
          sourceFile: rhdh-profile.py
          optional: false
    dynamic:
      includes:
        - dynamic-plugins.default.yaml
      plugins:
        - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-plugin-techdocs
          disabled: false
        - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
          disabled: false
        # GitHub org discovery needs organization/app — disable (catalog via ConfigMap file).
        - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
          disabled: true
        - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
          disabled: true
        # Namespace-scoped scaffolder helpers (Deployments/Services via Hub SA RBAC)
        - package: ./dynamic-plugins/dist/backstage-community-plugin-scaffolder-backend-module-kubernetes-dynamic
          disabled: false
        # --- AI / MCP community plugins (ghcr.io overlays for RHDH 1.10 / BS 1.49.4) ---
        - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.49.4__0.1.11!backstage-plugin-mcp-actions-backend
          disabled: false
        - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.49.4__0.2.2!red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras
          disabled: false
        - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.49.4__0.2.3!red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras
          disabled: false
        - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-mcp-chat:bs_1.49.4__0.6.0!backstage-community-plugin-mcp-chat
          disabled: false
          pluginConfig:
            dynamicPlugins:
              frontend:
                backstage-community.plugin-mcp-chat:
                  dynamicRoutes:
                    - path: /mcp-chat
                      importName: McpChatPage
                      menuItem:
                        icon: MCPChatIcon
                        text: MCP Chat
        - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-mcp-chat-backend:bs_1.49.4__0.8.0!backstage-community-plugin-mcp-chat-backend
          disabled: false
    # Asset packs publish to Quay. Do not wire a non-janus image as catalogIndex.extraImages.
    catalogIndex:
      extraImages: []
  upstream:
    backstage:
      image:
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi
      appConfig:
        app:
          title: Agent-friendly Developer Hub
        # Demo: Guest login with permission framework off.
        auth:
          environment: development
          providers:
            guest:
              userEntityRef: user:default/guest
              dangerouslyAllowOutsideDevelopment: true
        permission:
          enabled: false
        catalog:
          locations:
            - type: file
              target: /opt/app-root/src/catalog/all.yaml
              rules:
                - allow: [Component, System, API, Resource, Location, Template, User, Group]
        backend:
          actions:
            pluginSources:
              - software-catalog-mcp-extras
              - techdocs-mcp-extras
          auth:
            externalAccess:
              - type: legacy
                options:
                  secret: ${BACKEND_SECRET}
                  subject: legacy-default-config
              - type: static
                options:
                  token: ${MCP_TOKEN}
                  subject: mcp-clients
          reading:
            allow:
              - host: github.com
              - host: raw.githubusercontent.com
              - host: "*.github.io"
        # MCP Chat → LiteLLM. Default demo model is LiteMaaS Qwen (tool calling).
        # Shared granite/qwen3 remain available via Lightspeed for chat-only.
        mcpChat:
          providers:
            - id: litellm
              baseUrl: http://rhdh-agent-sandbox-litellm:4000
              token: ${LITELLM_API_KEY}
              model: litemaas-qwen
          mcpServers:
            # Cluster MCP services are up before Hub; prefer these for reliable connect.
            - id: openshift-mcp
              name: OpenShift MCP
              url: http://rhdh-agent-sandbox-mcp:8080/mcp
            - id: k8s-mcp
              name: Kubernetes MCP
              url: http://rhdh-agent-sandbox-k8s-mcp:8085/mcp
            # Same-pod Streamable HTTP: may miss first connect while mcp-actions registers.
            # UI can reconnect; external clients use the Hub Route + mcp-token.
            - id: backstage-mcp
              name: Backstage MCP Actions
              url: http://localhost:7007/api/mcp-actions/v1
              headers:
                Authorization: Bearer ${MCP_TOKEN}
          systemPrompt: >-
            You are the agent-friendly Developer Hub assistant on OpenShift Developer Sandbox.
            Prefer catalog and TechDocs MCP tools when available; otherwise use OpenShift/Kubernetes MCP.
            Stay inside the user namespace. Summarize tool results clearly; list/get before mutate.
          quickPrompts:
            - title: Catalog overview
              description: List components in the software catalog
              prompt: List the Component entities in our Backstage catalog and summarize what each one does.
              category: Catalog
            - title: Namespace pods
              description: List pods in the current namespace
              prompt: List pods in this namespace and summarize their status.
              category: Infrastructure
            - title: TechDocs search
              description: Find docs related to MCP or Lightspeed
              prompt: Search TechDocs for MCP, Lightspeed, or LiteLLM and summarize the key pages.
              category: Docs
        kubernetes:
          serviceLocatorMethod:
            type: multiTenant
          clusterLocatorMethods:
            - type: config
              clusters:
                - url: https://kubernetes.default.svc
                  name: sandbox
                  authProvider: serviceAccount
                  skipTLSVerify: true
                  serviceAccountToken:
                    $file: /var/run/secrets/kubernetes.io/serviceaccount/token
        # Lightspeed → LiteLLM via lightspeed-core (ENABLE_VLLM / VLLM_*).
        # Model identifiers exposed by llama-stack are vllm/<name>.
        lightspeed:
          systemPrompt: >-
            You are the agent-friendly Developer Hub demo assistant on OpenShift Developer Sandbox.
            Prefer catalog, TechDocs, and namespace-scoped MCP tools. Stay inside the user namespace.
            When diagnosing cluster state, list/get before mutate and summarize risk.
          servers:
            - id: vllm/granite
              url: http://rhdh-agent-sandbox-litellm:4000/v1
              model: granite
            - id: vllm/qwen3
              url: http://rhdh-agent-sandbox-litellm:4000/v1
              model: qwen3
            - id: vllm/litemaas-qwen
              url: http://rhdh-agent-sandbox-litellm:4000/v1
              model: litemaas-qwen
          # Must match mcp_servers[].name in files/lightspeed-stack.yaml
          mcpServers:
            - name: mcp-integration-tools
              token: ${MCP_TOKEN}
      # IMPORTANT: Helm replaces arrays — keep chart-required env vars AND default volumes.
      extraEnvVars:
        - name: BACKEND_SECRET
          valueFrom:
            secretKeyRef:
              name: rhdh-agent-sandbox-secrets
              key: backend-secret
        - name: MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhdh-agent-sandbox-secrets
              key: mcp-token
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: rhdh-agent-sandbox-secrets
              key: litellm-master-key
        - name: POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rhdh-agent-postgresql
              key: postgres-password
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
      # RHDH 1.10.3 defaults + AI catalog ConfigMap mount.
      extraVolumeMounts:
        - name: dynamic-plugins-root
          mountPath: /opt/app-root/src/dynamic-plugins-root
        - name: extensions-catalog
          mountPath: /extensions
        - name: temp
          mountPath: /tmp
        - name: rhdh-agent-catalog
          mountPath: /opt/app-root/src/catalog
          readOnly: true
        - name: scaffolder-assets
          mountPath: /opt/app-root/src/scaffolder-assets
          readOnly: true
      extraVolumes:
        - name: dynamic-plugins-root
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 5Gi
        - name: dynamic-plugins
          configMap:
            defaultMode: 420
            name: '{{ printf "%s-dynamic-plugins" .Release.Name }}'
            optional: true
        - name: dynamic-plugins-npmrc
          secret:
            defaultMode: 420
            optional: true
            secretName: '{{ printf "%s-dynamic-plugins-npmrc" .Release.Name }}'
        - name: dynamic-plugins-registry-auth
          secret:
            defaultMode: 416
            optional: true
            secretName: '{{ printf "%s-dynamic-plugins-registry-auth" .Release.Name }}'
        - name: npmcacache
          emptyDir: {}
        - name: extensions-catalog
          emptyDir: {}
        - name: temp
          emptyDir: {}
        - name: rhdh-agent-catalog
          configMap:
            name: rhdh-agent-sandbox-catalog
        - name: scaffolder-assets
          projected:
            sources:
              - configMap:
                  name: rhdh-agent-sandbox-scaffolder-assets
                  items:
                    - key: deploy-agent-README.md
                      path: skeletons/deploy-agent/README.md
                    - key: deploy-agent-catalog-info.yaml
                      path: skeletons/deploy-agent/catalog-info.yaml
                    - key: deploy-agent-devfile.yaml
                      path: skeletons/deploy-agent/devfile.yaml
                    - key: python-manifests.yaml
                      path: agent-runtimes/python/manifests.yaml
                    - key: python-catalog-info.yaml
                      path: agent-runtimes/python/catalog-info.yaml
                    - key: nodejs-manifests.yaml
                      path: agent-runtimes/nodejs/manifests.yaml
                    - key: nodejs-catalog-info.yaml
                      path: agent-runtimes/nodejs/catalog-info.yaml
                    - key: quarkus-manifests.yaml
                      path: agent-runtimes/quarkus/manifests.yaml
                    - key: quarkus-catalog-info.yaml
                      path: agent-runtimes/quarkus/catalog-info.yaml
    postgresql:
      primary:
        persistence:
          size: 1Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
